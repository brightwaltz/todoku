# Fly.io の設定。アプリ名は作るときに決める（fly launch --no-deploy で上書きされる）
app = "todoku-machida"
primary_region = "nrt"

[http_service]
  internal_port = 8080
  force_https = true
  # 止めずに一時停止する。止まった状態からの最初の応答が約 7 秒かかっていた（一時停止なら数百ミリ秒。課金はどちらもディスクの分だけ）
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
