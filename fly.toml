# Fly.io の設定。アプリ名は作るときに決める（fly launch --no-deploy で上書きされる）
app = "todoku-machida"
primary_region = "nrt"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
