[project]
name = "todoku"
version = "0.1.0"
description = "高齢の方や介護する家族が困りごとを書くと、尋ねていない公的制度まで、判定の理由・申請先・持ち物・出典つきで示す相談窓口"
authors = [
    { name = "Kenichi Shibata", email = "1144934+brightwaltz@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
