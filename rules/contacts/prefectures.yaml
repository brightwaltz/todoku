# 47 都道府県の相談先（T-123）。/city/ の頁の都道府県の段に出す。読み込みと形の検査は src/todoku/contacts.py、テストは tests/test_contacts.py。
# 判定には使わない。書くのは URL・電話・確認日だけで、頁の文は写さない。名前と説明は contacts.py の KINDS で種類ごとに作る。
# キーは都道府県コード 2 桁（団体コードの頭 2 桁。引用符で囲む）。1 つの都道府県に何件でも置ける。
#
# family_branch：公益社団法人 認知症の人と家族の会の都道府県支部（47 都道府県に 1 つずつ）。
#   2026-11-05 に、本部のトップ頁（https://alzheimer.or.jp/）の支部の一覧から 47 支部の頁を開き、頁の題名が「<都道府県名>支部」であることを確かめて書いた。
#   tel は支部の頁の【電話番号】の最初の番号。香川県だけは、頁に「(変更）→」と書かれた新しい番号にした。
#   相談の曜日と時間、相談専用の番号は支部の頁にある（支部ごとに違うので、ここには書かない）。
#   利用条件：本部のトップ頁のリンクを全部見たが、サイトの利用やリンクの決まりの頁は無かった。支部の頁へのリンクと電話番号だけを置く。
#
# kokuho_complaint：都道府県の国民健康保険団体連合会（国保連）の、介護サービスの苦情相談の頁（T-130）。
#   2026-11-06 に、国民健康保険中央会のリンクの頁（https://www.kokuho.or.jp/link/）にある 47 の国保連のサイトを https で開き、
#   「苦情」を含むリンクを辿って、頁の題名か本文に介護サービスの苦情相談の案内があり、200 で返ることを確かめた。
#   tel は、頁に苦情相談の窓口の番号（「苦情相談窓口専用」「直通」「介護保険課」など）があればそれ、無ければ頁にある国保連の番号。
#   頁に番号が書かれていない所（埼玉・新潟・富山・愛知・島根・広島・鹿児島）は tel を空にした。
#   まだ入れていない 11（青森・秋田・石川・三重・岡山・山口・香川・福岡・佐賀・大分・沖縄）：苦情相談の頁が辿れない、https で開けない（香川）、
#   503 を返す（佐賀・沖縄）、案内が PDF だけ（福岡）。素の記録は ops-b の research/t130/。
#   利用条件：中央会のトップ頁には情報セキュリティポリシーの PDF だけで、サイトの利用やリンクの決まりの頁は無かった。頁へのリンクと電話番号だけを置く。
