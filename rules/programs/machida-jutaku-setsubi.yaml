id: machida-jutaku-setsubi
number: 18
name: 住宅設備改修給付（介護保険外）
level: machida
kind: review
summary: 浴槽・流し・洗面台の取り替えや、和式から洋式トイレへの取り替えの費用を、町田市が9割まで給付する。
weight: 1
eligibility:
  all:
    - {fact: lives_in_machida, is: true, label: 町田市に住んでいる}
    - {fact: age_band, in: [age_65_69, age_70_74, age_75_plus], label: 65歳以上}
    - any:
        - {fact: residence, in: [home], label: 自宅で暮らしている}
        # 入院中でも、戻る家があれば当たりうる（裁定、11/4）
        - all:
            - {fact: residence, in: [hospital], label: 入院中}
            - {ask_at: 申請のとき（高齢者支援課）, label: 退院したら自宅に戻る（窓口で確かめる）}
    - {fact: care_level, in: [support1, support2, care1, care2, care3, care4, care5], label: 要介護・要支援の認定を受けている, via: kaigo-nintei}
    # 使う予定は条件にしない。○ は「公式の条件に当たりうる（本人が望むかは問わない）」（裁定 p-plan、11/4）
at_application:
  - 同じ項目を、その世帯ですでに使っていないこと
  - 工事を始める前に申請すること
apply:
  where: 町田市 介護保険課 給付係（担当のケアマネジャーに相談する）
  phone: 042-724-4366
amount:
  - 浴槽の取り替えは10万円まで（給付は9万円まで）、流し・洗面台は15万6千円まで（14万400円まで）、和式から洋式への便器の取り替えは10万円まで（9万円まで）。どれも1世帯1回
cost:
  self_pay: partial
  share: "1割と、上限を超えた分"
  source: https://www.city.machida.tokyo.jp/iryo/kaigo/business/jutakukaisyu/jukai.html
sources:
  - url: https://www.city.machida.tokyo.jp/iryo/kaigo/business/jutakukaisyu/jukai.html
    publisher: 町田市
    title: 住宅改修（介護保険以外の住宅改修）
