id: machida-kasai-yobo
number: 15
name: 火災予防機器等給付
level: machida
kind: condition
summary: 物忘れなどで火の始末が心配な人に、煙感知器や電磁調理器を給付する。
weight: 1
eligibility:
  all:
    - {fact: lives_in_machida, is: true, label: 町田市に住んでいる}
    - {fact: age_band, in: [age_65_69, age_70_74, age_75_plus], label: 65歳以上}
    - {fact: household, in: [alone, elderly_only, alone_daytime], label: ひとり暮らし、高齢者だけの世帯、または日中はひとり}
    - {fact: fire_risk, is: true, label: 物忘れなどで火の始末が心配}
at_application:
  - 認知機能の低下で、防火への配慮が要る状態か
  - この給付を前に使ったことがないこと
  - 煙感知器は火災警報器が付いていない家、電磁調理器はふだんガスで調理している家が対象
apply:
  where: 担当の高齢者支援センターに申し込む（給付券が出る）
  phone: 問い合わせは高齢者支援課 042-724-2141
amount:
  - 煙感知器は1台8,000円まで（2台まで）、電磁調理器は15,000円まで
  - 住民税が課税の人は上限までの1割と上限を超えた分、非課税の人は上限を超えた分だけを負担する
sources:
  - url: https://www.city.machida.tokyo.jp/iryo/old/shiminnokatae/seikatsukurashi/moshimo/kasaianzenshisutemu.html
    publisher: 町田市
    title: 火災予防機器等給付
