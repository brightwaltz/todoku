id: kogaku-gassan
number: 4
name: 高額医療・高額介護合算療養費
level: national
kind: condition
summary: 8月から翌年7月までの1年の、医療と介護の自己負担の合計が限度額を超えた分が戻る。
weight: 2
eligibility:
  all:
    - {fact: care_level, in: [support1, support2, care1, care2, care3, care4, care5], label: 要介護・要支援の認定を受けている, via: kaigo-nintei}
    - {fact: uses_care_services, is: true, label: 介護保険のサービスを使っている（使う予定）, via: kaigo-nintei}
    - any:
        - {fact: high_medical_costs, is: true, label: 医療費の自己負担も多くかかっている}
        # 医療費が小さくても、施設の介護の自己負担が毎月あり、世帯が非課税なら、合計が限度額を超えうる（裁定 i03、11/4）
        - all:
            - {fact: residence, in: [facility], label: 施設に入所している}
            - {fact: tax_status, in: [household_exempt], label: 世帯の全員が住民税非課税（限度額が低い）}
at_application:
  - 8月1日〜翌年7月31日の1年で、同じ医療保険に入っている世帯の医療と介護の自己負担の合計が、所得の区分で決まる限度額を超えたか（超えた額が500円以下なら支給されない）
  - 高額療養費・高額介護サービス費で戻った分は差し引いて計算する
apply:
  where: 7月31日に入っていた医療保険。町田市の国民健康保険と後期高齢者医療は保険年金課。会社の健康保険の人は、先に町田市 介護保険課 給付係で介護の自己負担額証明書をもらい、健康保険に出す
  phone: 保険年金課 保険給付係 042-724-2130／高齢者医療係 042-724-2144／介護保険課 給付係 042-724-4366
bring:
  - 申請書、マイナンバーカードか資格確認書、振込口座が分かるもの（町田市の国民健康保険）
  - 会社の健康保険の人は、介護保険課の自己負担額証明書
amount:
  - 70歳以上の1年の限度額は、一般の区分で56万円、住民税非課税の世帯で31万円（一定の所得以下なら19万円）
timing:
  - 町田市の国民健康保険では、対象になる人に3月下旬ごろ案内が届く。時効は7月31日の翌日から2年
sources:
  - url: https://www.kyoukaikenpo.or.jp/benefit/high_cost_medical_expenses/003/index.html
    publisher: 全国健康保険協会（協会けんぽ）
    title: 高額介護合算療養費
    license: 協会けんぽのサイトの規定（引用可・改変不可）
    checked: 2026-11-02
  - url: https://www.mhlw.go.jp/web/t_doc?dataId=00tb5461&dataType=1&pageNo=1
    publisher: 厚生労働省保険局
    title: 健康保険における高額介護合算療養費の支給等の事務の取扱いについて（平成21年4月30日 保保発第0430001号）
    license: PDL1.0
    checked: 2026-11-03
  - url: https://www.city.machida.tokyo.jp/kurashi/hoken/kokuho/ironnakyuufu/kaigogatusann.html
    publisher: 町田市
    title: 国民健康保険 高額医療・高額介護合算療養費
    license: 町田市ホームページ利用規約（転載不可・リンク可）
    checked: 2026-11-02
procedures:
  # デジタル庁「行政手続等の棚卸調査結果（令和7年度）」を、Claude Code から行政手続データの MCP サーバーで引いた（2026-11-03）
  - id: "44987"
    name: "高額医療合算介護サービス費の支給の申請"
    law: "介護保険法施行規則"
    article: "第83条の4の4"
    attachments: "その他の添付書類"
  - id: "48359"
    name: "高額介護合算療養費の支給申請"
    law: "国民健康保険法施行規則"
    article: "第27条の26第1項"
    attachments: "所得証明書・納税証明書; その他の添付書類"
  - id: "48356"
    name: "高額介護合算療養費の支給の申請"
    law: "高齢者の医療の確保に関する法律施行規則"
    article: "第71条の9第1項"
    attachments: "その他の添付書類"
# 町田市以外にお住まいの人に出す申請先など（町田市の窓口・電話・書類の名前を出さない）
elsewhere:
  apply:
    where: 7月31日に入っていた医療保険（国民健康保険・後期高齢者医療はお住まいの市区町村、会社の健康保険はその保険者）。会社の健康保険の人は、先にお住まいの市区町村の介護保険の窓口で介護の自己負担額証明書をもらい、健康保険に出す
  bring:
  - 申請書、本人確認の書類、振込口座が分かるもの
  - 会社の健康保険の人は、介護の自己負担額証明書
  timing:
  - 時効は7月31日の翌日から2年
