    article: "第71条第1項"
    attachments: "その他の添付書類"
  - id: "44948"
    name: "介護予防福祉用具購入費の支給申請"
    law: "介護保険法施行規則"
    article: "第90条"
    attachments: "その他の添付書類"
# 町田市以外にお住まいの人に出す申請先など（町田市の窓口・電話・書類の名前を出さない）
elsewhere:
  apply:
    where: 買う前に担当のケアマネジャーか地域包括支援センターに相談する。申請はお住まいの市区町村の介護保険の担当窓口
