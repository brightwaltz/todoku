id: jutaku-kaishu
number: 5
name: 介護保険の住宅改修費の支給
level: national
kind: review
summary: 手すりの取り付けや段差の解消などの工事費を、生涯20万円まで、その9割（所得により8割・7割）を介護保険から受け取れる。
weight: 3
eligibility:
  all:
    - {fact: care_level, in: [applying, support1, support2, care1, care2, care3, care4, care5], label: 要介護・要支援の認定を受けている（申請中を含む）, via: kaigo-nintei}
    - {fact: residence, in: [home], label: 自宅で暮らしている}
    - {fact: plans_home_modification, is: true, label: 手すり・段差などの工事を考えている}
at_application:
  - 工事が対象の種類（手すり、段差の解消、床や通路の材料の変更、引き戸などへの扉の取り替え、洋式便器などへの取り替えと、それに付く工事）に当たるか
  - 工事をする家が住民票の住所であること。借家なら持ち主の承諾が要る
  - 工事を始める前に市の審査を受けること。審査の前に始めた工事は対象にならない
apply:
  where: まず担当のケアマネジャーか高齢者支援センターに相談する。書類はケアマネジャーなどがまとめて町田市 介護保険課 給付係に出す
  phone: 介護保険課 給付係 042-724-4366
bring:
  - 工事の前：事前申請書、住宅改修が必要な理由書（ケアマネジャーなどが作る）、見積書（あて名は本人）、カタログの写し、改修前と改修後の図面、改修前の日付入りの写真
  - 工事の後：支給申請書、請求書、領収書（あて名は本人）、改修後の日付入りの写真
amount:
  - 1人あたり生涯20万円まで。その9割（所得により8割・7割）が支給される
  - 市に登録した業者なら、自己負担分だけを払えばよい（受領委任払い）
timing:
  - 事前申請の審査は、書類がそろっていれば10日〜2週間ほど
sources:
  - url: https://www.mhlw.go.jp/content/12300000/001668164.pdf
    publisher: 厚生労働省
    title: 福祉用具・住宅改修の概要（介護保険福祉用具・住宅改修評価検討会 参考資料）
    license: PDL1.0
    checked: 2026-11-02
    quote: 要介護状態区分が重くなったとき（三段階上昇時）、また、転居した場合は再度２０万円までの支給限度基準額が設定される。
  - url: https://www.city.machida.tokyo.jp/iryo/kaigo/business/jutakukaisyu/jukai.html
    publisher: 町田市
    title: 住宅改修
    license: 町田市ホームページ利用規約（転載不可・リンク可）
    checked: 2026-11-02
