id: hosougu-hochoki
number: 26
name: 補装具費の支給（補聴器）
level: national
kind: review
summary: 聴覚障害の身体障害者手帳を持つ人が補聴器を作るとき、費用が補装具費として支給される。自己負担は原則1割で、所得に応じた月の上限がある。
weight: 2
eligibility:
  all:
    - {fact: hearing_difficulty, is: true, label: 聞こえにくく補聴器を考えている}
    # 身体障害者福祉法第4条で「身体障害者」は手帳の交付を受けた人。難病の人などは手帳がなくても対象になる
    - {prereq: shintai-techo-chokaku, label: 聴覚障害の身体障害者手帳を持っている}
at_application:
  - 身体障害者更生相談所などの判定か意見にもとづいて、市区町村長が決める
  - 本人か配偶者のうち、市町村民税の所得割がいちばん多い人の納税額が46万円以上だと対象外
  - 難病などの人は、手帳がなくても対象になる場合がある（障害者総合支援法の対象の病気）
apply:
  where: お住まいの市区町村の障害福祉の担当窓口
amount:
  - 原則1割負担
  - 月の上限は、生活保護と市町村民税非課税の世帯は0円、課税の世帯は37,200円
sources:
  - url: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/shougaishahukushi/yogu/hosouguhisikyuuseido.html
    publisher: 厚生労働省
    title: 補装具費支給制度の概要
    license: PDL1.0
    checked: 2026-11-03
    quote: 障害者又は障害児の保護者が市町村長に申請し、身体障害者更生相談所等の判定又は意見に基づく市町村長の決定により、補装具費の支給を受ける。
  - url: https://laws.e-gov.go.jp/law/324AC1000000283
    publisher: e-Gov 法令検索（デジタル庁）
    title: 身体障害者福祉法 第4条（「身体障害者」は手帳の交付を受けた人）
    license: 法令（著作権法第13条により権利の目的とならない。ここでは引用しない）
    checked: 2026-11-03
procedures:
  # デジタル庁「行政手続等の棚卸調査結果（令和7年度）」を、Claude Code から行政手続データの MCP サーバーで引いた（2026-11-03）
  - id: "45716"
    name: "補装具費の支給に関する申請"
    law: "障害者の日常生活及び社会生活を総合的に支援するための法律"
    article: "第76条第1項"
    attachments: "所得証明書・納税証明書; その他の添付書類"
