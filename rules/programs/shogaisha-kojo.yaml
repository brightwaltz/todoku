id: shogaisha-kojo
number: 9
name: 障害者控除（要介護の高齢者）
level: national
kind: review
summary: 65歳以上で市の認定を受けた人は、障害者手帳がなくても所得税・住民税の障害者控除を受けられる。扶養している家族の税も軽くなる。
weight: 2
eligibility:
  any:
    - {prereq: machida-shogaisha-nintei, label: 町田市の障害者控除対象者認定書を受ける}
    # 町田市以外でも、認定は市町村長等が行う（国税庁 No.1160）。基準は市区町村ごとに決めているので、規則では先にする手続きとして示す
    - all:
        - {fact: lives_in_machida, is: false, label: 町田市以外にお住まい}
        - {fact: age_band, in: [age_65_69, age_70_74, age_75_plus], label: 65歳以上}
        - {step: true, label: お住まいの市区町村で、障害者控除対象者認定書（市町村長等の認定）を受ける}
at_application:
  - 控除を受けるのは、本人か、本人を扶養している家族で、所得税・住民税を納めている人
  - 市の認定が「特別障害者に準ずる」なら、控除の額が大きくなる
  - 町田市以外では、認定の基準と申請先はお住まいの市区町村に聞く
apply:
  where: 確定申告（町田税務署）
  phone: 町田税務署 042-728-7211
bring:
  - 町田市の障害者控除対象者認定書
amount:
  - 所得控除の額は、障害者27万円、特別障害者40万円、いつも同居している特別障害者75万円
timing:
  - その年の12月31日の状態で決まる。過去の年の分も、翌年1月1日から5年間は還付申告ができる
cost:
  self_pay: tax
  source: https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1160.htm
sources:
  - url: https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1160.htm
    publisher: 国税庁
    title: No.1160 障害者控除
    license: PDL1.0
    checked: 2026-11-02
  - url: https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1186.htm
    publisher: 国税庁
    title: No.1186 身体障害者手帳等の交付を申請中である場合の障害者控除の適用について
    license: PDL1.0
    checked: 2026-11-03
  - url: https://laws.e-gov.go.jp/law/340AC0000000033
    publisher: e-Gov 法令検索（デジタル庁）
    title: 所得税法 第85条（扶養親族等の判定の時期等）
    license: 法令の本文（著作権法第13条により権利の対象外。e-Gov は PDL1.0）
    checked: 2026-11-03
  - url: https://www.city.machida.tokyo.jp/iryo/old/shiminnokatae/seikatsukurashi/zeikojo/syogaikoujyo.html
    publisher: 町田市
    title: 障害者控除対象者認定書
    license: 町田市ホームページ利用規約（転載不可・リンク可）
    checked: 2026-11-02
procedures:
  # デジタル庁「行政手続等の棚卸調査結果（令和7年度）」を、Claude Code から行政手続データの MCP サーバーで引いた（2026-11-03）
  - id: "57538"
    name: "国税申告手続（所得税申告）"
    law: "所得税法"
    article: "第120条第1項"
    attachments: "添付書類なし"
    match: general
    note: "障害者控除は確定申告で受ける（この規則の申請先と同じ）。この手続のレコードに障害者控除の記載はない"
# 町田市以外にお住まいの人に出す申請先など（町田市の窓口・電話・書類の名前を出さない）
elsewhere:
  apply:
    where: 確定申告（お住まいを受け持つ税務署）
  bring:
  - お住まいの市区町村の障害者控除対象者認定書
