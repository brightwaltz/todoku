id: tokyo-silver-pass
number: 33
name: 東京都シルバーパス
level: tokyo
kind: condition
summary: 都内に住む70歳以上の人が、都内のバスなどに乗れるシルバーパスを買える。住民税が非課税か、前の年の合計所得金額が135万円以下なら年1,000円。
weight: 1
eligibility:
  all:
    - {fact: lives_in_tokyo, is: true, label: 東京都に住んでいる}
    - {fact: age_band, in: [age_70_74, age_75_plus], label: 70歳以上}
at_application:
  - 寝たきりの人は対象外
  - 負担の額は住民税で決まる。本人が課税でも、前の年の合計所得金額が135万円以下などなら1,000円（令和8年度の経過措置）
  # 2026-11-05 に東京都福祉局の頁（トップ→高齢者→社会参加の支援→シルバーパスについて。2026-10-01 更新）で照らした。経過措置と 135 万円は頁のとおり。145 万円の行はその頁の注から
  - 令和8年度は、給与の収入がある人は、介護保険料の通知書の合計所得金額が135万円を超え145万円以下でも、1,000円で買える場合がある（窓口で確かめる）
apply:
  where: 都内のシルバーパスの発行窓口（バスの営業所や都営地下鉄の定期券売り場など）
  how: 窓口でその場で発行される。代理人も申し込める
  phone: 東京バス協会 シルバーパス専用電話 03-5308-6950（平日9〜17時）
bring:
  - 本人確認の書類（マイナンバーカード、運転免許証など）
  - 名前の入ったPASMO（なければ窓口で作れる。作る費用は別に1,000円）
  # 2026-11-05 に silver-pass.tokyo/obtaining/ で照らし直した。所得 135 万円以下の人は課税なので非課税証明書が出ない。頁の書類は「課税証明書」
  - 1,000円で買う人は、住民税の課税の状況が分かる書類を1つ（コピーは不可）：介護保険料の納入（決定）通知書、住民税の課税証明書（非課税の人は非課税証明書でもよい）、生活保護の受給証明書（3か月以内に出たもので、受けている保護の種類に「生活扶助」と書いてあるもの）。所得135万円以下で買う人は、通知書に合計所得金額が無ければ課税証明書を取る
  # 2026-11-05 に東京都福祉局の「シルバーパスについて」の頁の注1・注2・注4で照らした（仮決定の通知書は使えない・出し直しはできない・生活扶助の記載があるものだけ）
  - 介護保険料の通知書は、6月以降に届く納入（決定）通知書か変更（更正）通知書を持っていく。4月ごろに届く仮決定の通知書は使えない。通知書は出し直してもらえないので、無くしたら住民税の課税（非課税）証明書を取る
amount:
  - 年12,000円。住民税が非課税の人と、前の年の合計所得金額が135万円以下の人は1,000円（135万円以下は令和8年度の経過措置）
timing:
  - いつでも買える。70歳になる月の2か月前の1日から申し込める
  - 使い始める日は、申し込んだ日・翌月1日・翌々月1日から選べる（2026年10月から）
  - 使い始める月の初日から1年間使える（東京都福祉局のページ）
cost:
  self_pay: partial
  # 2026-11-05 に照らし直し、合計所得 135 万円以下の人も 1,000 円なので足した
  share: "年12,000円。非課税か所得135万円以下なら1,000円"
  who_can_apply: [本人, 代理人]
  source: https://www.silver-pass.tokyo/
sources:
  # 都の福祉局のサイトは、トップページ以外へのリンクに事前の許諾が要る（サイトポリシー、2023-11-07）。トップページを示す
  - url: https://www.fukushi.metro.tokyo.lg.jp/
    publisher: 東京都福祉局
    title: 東京都福祉局（トップページから「高齢者」→「シルバーパスについて」）
    license: 東京都福祉局サイトポリシー（転載不可・トップページ以外へのリンクは事前の許諾が要る）
    checked: 2026-11-03
