id: kaigo-nintei
number: 1
name: 要介護・要支援認定の申請
level: national
kind: review
summary: 介護保険のサービスを使うための入口の手続き。住宅改修・福祉用具や、市区町村のいくつもの制度が、この認定を前提にしている。
weight: 3
done_when:
  fact: care_level
  in: [support1, support2, care1, care2, care3, care4, care5]
  label: 要介護・要支援の認定を受けている
pending_when:
  fact: care_level
  in: [applying]
  label: 申請して、結果を待っている
eligibility:
  all:
    - any:
        - {fact: age_band, in: [age_65_69, age_70_74, age_75_plus], label: 65歳以上}
        - {fact: age_band, in: [age_40_64], label: 40〜64歳（介護が要る原因が特定疾病のとき）}
    # 前に「非該当（自立）」だった人も、様子が変われば申請し直せる（非該当の人は申請できない、という定めはない。裁定 p-jiritsu）
    - {fact: care_level, in: [none, jiritsu], label: まだ認定を受けていない（前に「非該当」だった場合を含む）}
    # 当たりうるかは、いまの様子で決める（裁定 p-prereq）。介助や手助けの要る場面がなければ、申請しても非該当の見込み
    - {fact: needs_daily_help, is: true, label: 日々の暮らしで介助や手助けが要る場面がある}
at_application:
  - 介護が必要な状態か、どの区分（要支援1・2、要介護1〜5、非該当）になるかは、市の認定調査と主治医意見書をもとに介護認定審査会が決める
  - 40〜64歳の人は、介護が要る原因が16種類の特定疾病のどれかであること
apply:
  where: 町田市 介護保険課・高齢者支援課（市役所1階 111・112番窓口）、市民センター、高齢者支援センター
  how: 窓口、郵送（介護保険課 認定係あて）、電子申請（まちドア。本人のマイナンバーカードが要る）。ケアマネジャーや高齢者支援センターの職員に申請を手伝ってもらえる
  phone: 介護保険課 認定係 042-724-4365
bring:
  - 介護保険の被保険者証
  - 認定申請書（2026年4月から新しい様式）
  - 40〜64歳の人は医療保険の保険証
amount:
  - 申請にお金はかからない。主治医意見書の作成料を本人が払うこともない
timing:
  - 結果は原則として申請から30日以内に届く（厚生労働省）
cost:
  self_pay: none
  share: "主治医意見書の作成料も本人は払わない"
  # 2026-11-05 に照らし直し、意見書の作成料を書いている厚生労働省の頁に替えた（町田市の頁には費用の記述がない）
  source: https://www.kaigokensaku.mhlw.go.jp/commentary/flow.html
sources:
  - url: https://www.kaigokensaku.mhlw.go.jp/commentary/flow.html
    publisher: 厚生労働省（介護サービス情報公表システム）
    title: サービス利用までの流れ
    license: 介護サービス情報公表システムの規定（転載は出所を明記）
    checked: 2026-11-02
  - url: https://www.kaigokensaku.mhlw.go.jp/commentary/about.html
    publisher: 厚生労働省（介護サービス情報公表システム）
    title: 介護保険とは
    license: 介護サービス情報公表システムの規定（転載は出所を明記）
    checked: 2026-11-03
  - url: https://www.city.machida.tokyo.jp/iryo/kaigo/nagare/the-step-of-service.html
    publisher: 町田市
    title: 要介護（要支援）認定の申請
    license: 町田市ホームページ利用規約（転載不可・リンク可）
    checked: 2026-11-02
procedures:
  # デジタル庁「行政手続等の棚卸調査結果（令和7年度）」を、Claude Code から行政手続データの MCP サーバーで引いた（2026-11-03）
  - id: "110382"
    name: "要介護認定の申請"
    law: "介護保険法"
    article: "第27条第1項"
    attachments: "その他の添付書類"
  - id: "110391"
    name: "要支援認定の申請"
    law: "介護保険法"
    article: "第32条第1項"
    attachments: "その他の添付書類"
# 町田市以外にお住まいの人に出す申請先など（町田市の窓口・電話・書類の名前を出さない）
elsewhere:
  apply:
    where: お住まいの市区町村の介護保険の担当窓口、または地域包括支援センター
    how: 窓口や郵送で申請できる。地域包括支援センターやケアマネジャーに申請を手伝ってもらえることがある
