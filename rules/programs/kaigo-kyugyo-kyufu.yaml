id: kaigo-kyugyo-kyufu
number: 8
name: 介護休業給付金
level: national
kind: condition
summary: 介護をする家族が仕事を休むとき、休業前の賃金の67%が雇用保険から出る。同じ家族について通算93日・3回まで。
weight: 3
eligibility:
  all:
    - {fact: caregiver_employee, is: true, label: 介護する家族の中に、会社などに雇われて働いている人がいる}
    - {fact: caregiver_insured, is: true, label: その人が雇用保険に入っている}
    - any:
        # 介護休業・介護休暇の「常時介護を必要とする状態」は、要介護2以上か、項目の表の基準に当たる状態（厚生労働省 よくあるお問い合わせ）
        - {fact: care_level, in: [care2, care3, care4, care5], label: 要介護2〜5（常時介護が要る状態に当たる）}
        - {fact: constant_care_2w, is: true, label: 2週間以上、いつも介護が要る状態}
at_application:
  - 休業を始める前の2年間に、雇用保険に入っていた期間が12か月以上あること
  - 介護される人が、配偶者・父母・子・配偶者の父母・祖父母・兄弟姉妹・孫であること
  - 要介護1以下や認定の前でも、歩く・排せつ・食事・物忘れなどの項目の表で「常時介護が要る」に当たれば対象（勤め先が判断する）
  - 勤め先に介護休業を申し出て、実際に休むこと
apply:
  where: 勤め先の所在地を受け持つハローワーク。原則として勤め先を通して出す（本人が出すことも、電子申請もできる）
bring:
  - 介護休業給付金支給申請書
  - 勤め先に出した介護休業申出書
  - 介護される家族との続柄が分かる書類（住民票記載事項証明書など）
  - 出勤簿やタイムカード、賃金台帳
amount:
  - 1か月ごとに、休業前の賃金日額×支給日数×67%（月の上限は366,222円。毎年8月1日に変わる）
  - 同じ家族について通算93日・3回まで
timing:
  - 休業が終わった日（3か月を超えるときは始めた日から3か月たった日）の翌日から2か月たつ日が属する月の末日まで
cost:
  self_pay: receive
  share: "休業前の賃金の67%"
  source: https://www.hellowork.mhlw.go.jp/insurance/insurance_continue.html
sources:
  - url: https://www.hellowork.mhlw.go.jp/insurance/insurance_continue.html
    publisher: 厚生労働省（ハローワークインターネットサービス）
    title: 雇用継続給付
    license: PDL1.0
    checked: 2026-11-02
    quote: 介護休業給付の各支給対象期間（1か月）ごとの支給額は、原則として休業開始時賃金日額×支給日数×67％です。
  - url: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000158665.html
    publisher: 厚生労働省
    title: 介護休業給付の内容と支給申請手続 Q&A
    license: PDL1.0
    checked: 2026-11-02
    quote: 介護休業を開始した日前２年間に被保険者期間が12か月（※）以上必要となります。
  - url: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyoukintou/ryouritsu/otoiawase_jigyousya.html
    publisher: 厚生労働省
    title: よくあるお問い合わせ（事業主の方へ）（常時介護を必要とする状態に関する判断基準）
    license: PDL1.0
    checked: 2026-11-04
    quote: 介護保険制度の要介護状態区分において要介護２以上であること。
procedures:
  # デジタル庁「行政手続等の棚卸調査結果（令和7年度）」を、Claude Code から行政手続データの MCP サーバーで引いた（2026-11-03）
  - id: "52782"
    name: "介護休業給付金の支給申請手続"
    law: "雇用保険法施行規則"
    article: "第101条の19第1項"
    attachments: "住民票; 戸籍; その他の添付書類"
