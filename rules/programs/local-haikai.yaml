id: local-haikai
number: 29
name: 行方不明のおそれがある人の探索・見守り
level: local
kind: review
summary: 認知症などで行方不明になるおそれのある人を、GPS などの機器や地域の見守りの仕組みで早く見つける市区町村の事業。2017年4月時点で、GPS などの機器は全国1,741市町村のうち442、捜索・見守りの仕組みは801がしていた。
weight: 1
eligibility:
  all:
    - {fact: lives_in_machida, is: false, label: 町田市以外にお住まい（町田市と横浜市は、市の制度を一つずつ示しています）}
    - {fact: wandering_risk, is: true, label: 行方不明になるおそれがある}
    - {ask_at: お住まいの市区町村の高齢者福祉・介護保険の窓口, label: お住まいの市区町村がこの事業をしている（窓口で確かめる）}
at_application:
  - 事業をしているか、対象や内容、費用は市区町村ごとに違う
  - 数字は 2017年4月時点の全国調査で、今とは違う可能性がある
  - ここでの条件は、この事業に関係しそうかの目安で、市区町村の要件ではない
apply:
  where: お住まいの市区町村の高齢者福祉・介護保険の担当窓口、または地域包括支援センター
# 出典の原文で費用を言えないので、窓口で確かめる（T-073）
cost:
  self_pay: ask
sources:
  - url: https://www.pref.saitama.lg.jp/documents/149759/739.pdf
    publisher: 厚生労働省 老健局（介護保険最新情報 Vol.739 の参考資料。埼玉県のサイトに載った写し）
    title: 平成29年度介護保険事務調査の集計結果について（訂正後。調査時点 2017年4月1日、1,741市町村）
    license: 利用条件を確かめていない（引用しない）
    checked: 2026-11-03
