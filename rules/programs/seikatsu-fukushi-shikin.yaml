id: seikatsu-fukushi-shikin
number: 27
name: 生活福祉資金貸付（福祉費）
level: national
kind: review
summary: 収入の少ない世帯や、65歳以上の人がいる世帯などが、住宅の改修や介護サービスを使うための費用を、低い利子（保証人がいれば無利子）で借りられる。
weight: 1
eligibility:
  # 対象の世帯は、低所得者世帯（市町村民税非課税程度）・障害者世帯・高齢者世帯。使い道（住宅の改修・介護サービス）は条件にしない（裁定 p-plan、11/4）
  any:
    - {fact: tax_status, in: [household_exempt], label: 世帯の全員が住民税非課税（低所得者世帯の目安）}
    # 高齢者世帯は、国の要綱で、日常生活で療養や介護が要る 65 歳以上の人がいる世帯に限られる（下の at_application）
    - all:
        - {fact: age_band, in: [age_65_69, age_70_74, age_75_plus], label: 65歳以上の人がいる世帯}
        - {fact: needs_daily_help, is: true, label: 日々の暮らしで療養や介護が要る}
    # 障害者世帯（身体障害者手帳などを持つ人がいる世帯）。手帳の有無は聞かず、介護が要る人に窓口で確かめてもらう（裁定 i24）
    - all:
        - {fact: needs_daily_help, is: true, label: 日々の暮らしで療養や介護が要る}
        - {ask_at: 申請のとき（社会福祉協議会）, label: 障害者手帳などを持つ人がいる世帯（窓口で確かめる）}
at_application:
  - 貸付なので、返していける見込みがあるかも審査される
  - 保証人は原則として要る。保証人がいれば無利子、いなければ年1.5%
  - 障害者手帳を持つ人がいる世帯（障害者世帯）も対象
  - 生活保護を受けている世帯は原則として対象外（福祉事務所と相談のうえで使える場合がある）
  - 福祉資金を借りられる高齢者世帯は、国の要綱で、日常生活で療養や介護が要る65歳以上の人がいる世帯に限られる（2011年の改正通知で確かめた）
apply:
  where: お住まいの市区町村の社会福祉協議会（貸し付けるのは都道府県の社会福祉協議会）
amount:
  - 福祉費の限度額は580万円以内（用途ごとに目安がある）
  - 据置期間は6か月以内、返済は据置のあと20年以内
cost:
  self_pay: loan
  share: "保証人がいれば無利子、いなければ低い利子"
  source: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/seikatsuhogo/seikatsu-fukushi-shikin1/index.html
