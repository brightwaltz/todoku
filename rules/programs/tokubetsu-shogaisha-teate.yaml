id: tokubetsu-shogaisha-teate
number: 22
name: 特別障害者手当
level: national
kind: review
summary: 精神や身体に著しく重い障害があり、日常生活で常に特別の介護が要る20歳以上の在宅の人に、毎月手当が出る。重さは医師の認定診断書で判断される。
weight: 2
eligibility:
  all:
    - {fact: severe_constant_care, is: true, label: 日常生活のほとんどに常に介護が要る（重さは医師の認定診断書で判断される）}
    - any:
        - {fact: residence, in: [home], label: 自宅で暮らしている}
        # 入院が 3 か月を超えて続くと対象外。入院中の人は、入院の長さを確かめる（裁定、11/4）
        - all:
            - {fact: residence, in: [hospital], label: 入院中}
            - {ask_at: 申請のとき（市区町村の障害福祉の窓口）, label: 入院が3か月を超えて続いていない（窓口で確かめる）}
at_application:
  - 20歳以上であること
  - 医師の認定診断書（障害の種類ごとの様式）で、著しく重度の障害と認められること
  - 施設に入所していないこと。病院に3か月を超えて続けて入院していないこと
  - 本人・配偶者・扶養義務者の所得が限度額を超えないこと（超えると8月分から翌年7月分まで止まる）
apply:
  where: お住まいの市区町村の障害福祉の担当窓口
bring:
  - 認定診断書（障害の種類ごとの様式）
amount:
  - 月額30,450円（令和8年4月分から。それまでは29,590円。額は年度によって改定される）
  - 2月・5月・8月・11月に、それぞれ前の月の分までがまとめて支払われる
timing:
  - 請求した月の翌月分から支給される（さかのぼっては出ない）
cost:
  self_pay: receive
  share: "月30,450円"
  source: https://www.mhlw.go.jp/bunya/shougaihoken/jidou/tokubetsu.html
sources:
  - url: https://www.mhlw.go.jp/bunya/shougaihoken/jidou/tokubetsu.html
