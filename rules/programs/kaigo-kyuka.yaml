id: kaigo-kyuka
number: 21
name: 介護休暇
level: national
kind: condition
summary: 介護をする家族が、1年に5日（介護される家族が2人以上なら10日）まで、1日単位か時間単位で仕事を休める。勤め先に申し出る。
weight: 2
eligibility:
  all:
    - {fact: caregiver_employee, is: true, label: 介護する家族の中に、会社などに雇われて働いている人がいる}
    - any:
        # 介護休業・介護休暇の「常時介護を必要とする状態」は、要介護2以上か、項目の表の基準に当たる状態（厚生労働省 よくあるお問い合わせ）
        - {fact: care_level, in: [care2, care3, care4, care5], label: 要介護2〜5（常時介護が要る状態に当たる）}
        - {fact: constant_care_2w, is: true, label: 2週間以上、いつも介護が要る状態}
at_application:
  - 要介護1以下や認定の前でも、歩く・排せつ・食事・物忘れなどの項目の表で「常時介護が要る」に当たれば対象（勤め先が判断する）
  - 介護される人が、配偶者・父母・子・祖父母・兄弟姉妹・孫・配偶者の父母であること
  - 日々雇われる人は対象外。労使協定があると、週の所定労働日数が2日以下の人は対象外になることがある
apply:
  where: 勤め先（事業主）に申し出る
amount:
  - 介護される家族が1人なら1年に5日まで、2人以上なら10日まで
  - 1日単位か時間単位で休める（時間単位で取りにくい仕事の人は、労使協定で1日単位だけになることがある）
  - 休んだ日を有給にするか無給にするかは、会社の規定による
timing:
  - 「1年間」は、会社が決めていなければ4月1日から翌年3月31日まで
sources:
  - url: https://www.mhlw.go.jp/seisakunitsuite/bunya/koyou_roudou/koyoukintou/ryouritsu/kaigo/shorttime-leave/
    publisher: 厚生労働省
    title: 介護休業制度特設サイト「介護休暇」
    license: PDL1.0
    checked: 2026-11-03
    quote: 対象家族が１人の場合は、１年間に５日まで。
  - url: https://www.mhlw.go.jp/content/11900000/001259367.pdf
    publisher: 厚生労働省
    title: 育児・介護休業法 改正のリーフレット（労使協定で対象外にできる人）
    license: PDL1.0
    checked: 2026-11-03
  - url: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyoukintou/ryouritsu/otoiawase_jigyousya.html
    publisher: 厚生労働省
    title: よくあるお問い合わせ（事業主の方へ）（常時介護を必要とする状態に関する判断基準）
    license: PDL1.0
    checked: 2026-11-04
    quote: 介護保険制度の要介護状態区分において要介護２以上であること。
procedures_none: "介護休暇は労働者が事業主に申し出る手続で、行政手続データにない（2026-11-03 に MCP で全文検索。「介護休暇」の 3 件は国家公務員の勤務時間法の手続）"
