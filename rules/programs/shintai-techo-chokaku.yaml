id: shintai-techo-chokaku
number: 25
name: 身体障害者手帳（聴覚障害）
level: national
kind: review
summary: 聴力が等級表の基準（両耳とも70デシベル以上など）に当たるとき、聴覚障害の身体障害者手帳（6級から）の対象になる。手帳があると、補聴器の補装具費などが使える。
weight: 1
eligibility:
  all:
    - {fact: hearing_difficulty, is: true, label: 聞こえにくい}
    - {fact: hearing_certifiable, is: true, label: 聴力が手帳の基準に当たる（両耳とも70デシベル以上など。耳鼻咽喉科の検査）}
at_application:
  - 都道府県知事の定める医師の診断書を添えて申請する（身体障害者福祉法第15条）
  - 障害が一定以上で、ずっと続くと見込まれること
apply:
  where: お住まいの市区町村の障害福祉の担当窓口（交付するのは都道府県知事・指定都市市長・中核市市長）
bring:
  - 都道府県知事の定める医師の診断書
amount:
  - 聴覚障害の等級は2・3・4・6級
  - 6級：両耳とも70デシベル以上、または片耳90デシベル以上でもう片耳50デシベル以上
  - 4級：両耳とも80デシベル以上、または両耳での言葉の聞き取り（最良の語音明瞭度）が50%以下
  - 3級：両耳とも90デシベル以上。2級：両耳とも100デシベル以上
# 出典の原文で費用を言えないので、窓口で確かめる（T-073）
cost:
  self_pay: ask
