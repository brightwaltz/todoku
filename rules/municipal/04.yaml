  name: ゆずりあい駐車場の利用証の交付
  name_on_page: 宮城県ゆずりあい駐車場利用制度
  summary: 歩行が困難な障害者・要介護認定を受けた人・妊産婦などに、駐車区画の利用証を県が交付する。
  who: {}
  at_application:
  - 歩行が困難な人のうち、頁の表に定める要件に当たる人
  - 対象は身体・知的・精神の障害のある人、難病患者、要介護認定を受けた人、妊産婦、けが人など
  - 運転免許の有無や自動車の保有は要件に含まれない
  - 利用証は 1 人に 1 枚。協力施設の対象区画で使う
  where: 県の申請窓口、郵送（県社会福祉課宛て）、みやぎ電子申請サービス。柴田町・七ヶ浜町・大郷町の住民は町の窓口でも申請できる
  url: https://www.pref.miyagi.jp/soshiki/syahuku/parking.html
