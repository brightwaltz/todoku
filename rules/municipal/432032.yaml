  summary: 要介護等の高齢者の住宅改造費を、上限 50 万円まで助成する
  who: {}
  at_application:
  - 65歳以上で要支援・要介護の認定を受けた人（同等の人を含む）か、その同居者
  - 65歳未満で身体障害者手帳1・2級、療育手帳A1・A2の人も対象
