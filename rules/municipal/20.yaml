  name: 信州パーキング・パーミット（障がい者等用駐車場利用証）
  name_on_page: 信州パーキング・パーミット（障がい者等用駐車場利用証）制度
  summary: 障がい者・高齢者・難病患者・妊産婦・けが人など歩行が困難な人に、県内共通の利用証を県が交付する。
  who: {}
  at_application:
  - 障がい者・難病患者・高齢者・妊産婦・けが人などで、歩行が困難な人（対象者一覧表のとおり）
  - 高齢者は、介護保険被保険者証（要介護状態区分の記載のあるページ）で確かめる
  - 障がい者は手帳で確かめる。等級などの基準は、頁の PDF「対象者一覧表」にある
  - 難病患者・妊産婦・けがや病気の人は、受給者証・母子健康手帳・診断書等で確かめる
  where: お住まいの市町村の窓口か県内10か所の保健福祉事務所（郵送は県庁地域福祉課へ、返信用切手180円を同封）
  url: https://www.pref.nagano.lg.jp/chiiki-fukushi/parkingpermit/20151224.html
