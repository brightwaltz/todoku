  name: 京都おもいやり駐車場利用証（パーキングパーミット）
  name_on_page: 京都おもいやり駐車場利用証制度
  summary: 歩行が困難な要介護・要支援の人などに、府が駐車場の優先利用証を交付する。
  who: {}
  at_application:
  - 歩行が困難か、歩くときに介助者の特別な配慮が必要な人が対象
  - 高齢者の欄は、要介護・要支援の認定を受けた人（介護保険被保険者証を持参）
  - ほか、身体・知的・精神の手帳、難病の受給者証、妊産婦・保護者、医師の診断書の欄もある
  - 利用証は、対象の人が駐車場を使う（同乗を含む）ときだけ使える。貸与・譲渡は不可
  - 有料駐車場でも、利用証による料金の減免は受けられない
  where: 府の窓口（府庁1号館の府民総合案内・相談センター、各保健所など）で即日交付。要介護・要支援は綾部市・亀岡市・八幡市・南丹市の担当窓口、笠置町、京丹波町でも受付。郵送は府地域福祉推進課（返信用切手140円を同封）
  url: https://www.pref.kyoto.jp/omoiyari-pp/index.html
