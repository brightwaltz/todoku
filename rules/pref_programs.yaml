# 47 都道府県の、本人か家族が個人で申し込める高齢者・介護の制度を調べた記録（T-129）。/city/ の頁の都道府県の段に出す。
# 読み込みと形の検査は src/todoku/pref_programs.py、テストは tests/test_pref_programs.py。判定には使わない。
# 規則にできた都の制度（東京都シルバーパスなど）は rules/programs に level 付きで書き、ここには書かない。
# 神奈川県（2026-11-03、見つからなかった）は src/todoku/city.py の PREF_NONE_FOUND にある。
#
# キーは都道府県コード 2 桁（団体コードの頭 2 桁。引用符で囲む）。
#   checked：確かめた日
#   looked：見た頁の URL（県の高齢者・介護の案内の頁など）
#   found：見つかった制度（確かめる候補）。空なら「調べて、個人で申し込めるものが見つからなかった」と出す。
#     name：制度の名前／who：対象の主な条件の言い換え（頁の文は写さない）／where：申請先／url：出典
# 市町村が申し込み先で県は費用を出すだけの事業、事業者や団体が申し込むもの、全国一律の国の制度の窓口は入れない。
