    name: 認知症高齢者等位置探索サービス事業（GPS 端末の貸与）
    where: 地域共生推進課（郵送でも申し込める）
    conditions:
      - 市内に住む65歳以上の認知症の人など（40〜64歳で要介護などの認定を受けた人を含む）を介護する家族
      - 市が支援が要ると認めた人
      - GPS 端末を貸し出し、始めるときの費用は市が出す
      - 月々の費用は頁に無いので、問い合わせて確かめる
