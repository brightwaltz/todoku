  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業
    where: 65歳以上か介護保険の40〜64歳の人はくらし支援課、それ以外は障害福祉課
    conditions:
      - 生活保護などで資産が少なく、助成が無いと後見人の報酬を払えない人（親族の後見人は対象外）
      - 報酬の助成は月に施設18,000円・在宅28,000円まで。報酬の審判から3か月以内に申請
      - 申立ての費用は、生活保護などを受けて法テラスを使えない人に実費を助成（鑑定は10万円まで）
      - 令和8年10月に要綱が変わったので、細かい基準は窓口で確かめる
    sources:
