  - template: local-kaigo-yohin
    status: found
    name: 介護用品の支給（紙おむつ）
    where: 高齢介護課 管理チーム（窓口・郵送・にしのみやスマート申請）
    conditions:
      - 市内に住む要介護4か5の人で、いつも失禁がある
      - 本人と介護する家族の世帯が、どちらも市民税非課税で生活保護でない
      - 障害の日常生活用具でおむつを受けていない。入院中・施設に入っている人は対象外
      - 月1回届け、市の助成は月6,500円まで（超えた分は自己負担）
