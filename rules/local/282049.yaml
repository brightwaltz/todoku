    name: 家族慰労金の支給
    where: 高齢介護課 管理チームに問い合わせる
    conditions:
      - 家で暮らす要介護4か5の人を介護する家族（主に介護する配偶者か、生活を支える扶養義務者）
      - 直近1年、介護保険サービスを使っていない（ショートステイは年7日まで可）
      - 本人と家族の世帯が、どちらも市民税非課税
      - 年額12万円。頁の更新が2024年なので、今の内容は窓口で確かめる
