  - template: local-haikai
    status: found
    name: 福山市認知症ひとり歩きＳＯＳネットワーク・認知症高齢者等個人賠償責任保険事業
    where: 事前登録と保険の申し込みは福山市社会福祉協議会 福祉のまちづくり課（084-928-1333）。市の問い合わせ先は高齢者支援課 相談支援担当（084-928-1310）
    conditions:
      - 認知症などで行方不明になるおそれのある高齢者を、社会福祉協議会に前もって登録できる
      - 行方不明のときは警察署に届けを出す。協力団体や社会福祉協議会の公式 LINE の登録者に知らせる
      - 市内でＳＯＳネットワークに事前登録し、要介護か要支援の人は、賠償の保険に無料で入れる
      - 備後圏域（三原市・尾道市・府中市・世羅町・神石高原町・笠岡市・井原市）にも広げている
