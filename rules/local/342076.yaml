    name: 家族介護慰労金の支給
    where: 介護保険課（本庁舎 3 階、保険給付担当 084-928-1166）・高齢者支援課か、松永・北部・東部・神辺の保健福祉課、新市支所・沼隈支所（保健福祉担当）に申請書を出す
    conditions:
      - 要介護 4・5（またはこれに相当する）の人と同居し、家で 1 年以上介護している家族
      - 介護される人も、介護する人も市民税非課税
      - その間、介護保険のサービスを使っていない（ショートステイは通算 7 日まで）
      - 介護される人 1 人につき年 100,000 円
