    name: 家族介護用品の支給
    where: 介護保険課（本庁舎 3 階、保険給付担当 084-928-1166）か、松永・北部・東部・神辺の保健福祉課、新市支所・沼隈支所（保健福祉担当）に申請書を出す
    conditions:
      - 要介護 4・5（またはこれに相当する）の人と同居し、家で介護している家族
      - 介護される人も、介護する人も市民税非課税
      - 施設や病院に入っている間は対象外
      - 市の登録店で使える用品券を、年 75,000 円分まで（月 6,250 円分）。3 期に分けて渡す
