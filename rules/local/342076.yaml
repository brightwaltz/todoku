  - template: local-haishoku
    status: found
    name: 福山市「食」の自立支援事業（配食サービス）
    where: ケアマネジャー（地域包括支援センターなど）を通して、高齢者支援課（介護予防・政策担当 084-928-1189）か各支所（保健福祉担当）に申出書を出す
    conditions:
      - 65 歳以上で、ひとり暮らしか高齢者だけの世帯など
      - 要支援・要介護の認定か、基本チェックリストで事業対象者になった人
      - 栄養の改善と安否の確認が要ると認められた人
      - 1 日 1 食（昼か夜）を週 5 日まで届け、安否も確かめる
