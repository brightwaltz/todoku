  - template: local-haikai
    status: found
    name: 徘徊高齢者家族支援サービス事業・徘徊高齢者等発見支援メール事業
    where: 高齢介護室（総務・地域支援担当）
    conditions:
      - 市内に住所があり要介護 1 以上で、介護保険で GPS 付きの徘徊感知機器を借りている人
      - その GPS の利用料（介護保険の外の分）に当たる額を、月 550 円まで市が給付する
      - 徘徊のおそれのある 40 歳以上の市民は、家族などが前もってメール事業に登録できる
      - 行方が分からなくなり警察に捜索願を出したら、市が協力者にメールで特徴を送る
