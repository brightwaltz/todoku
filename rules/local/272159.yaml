  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業（申立て費用と報酬の助成）
    where: 高齢介護室（64 歳以下の人は障害福祉課）
    conditions:
      - 市内に住み、生活保護を受けているか、費用を払うとそれに準じる状態になる人
      - 預貯金が 50 万円未満で、使える資産が無い。親族や市民後見人が後見人になる場合は対象外
      - 申立ての印紙・切手・鑑定料を 10 万円まで。本人が払い、審判の確定から 1 年以内に申請
      - 後見人などの報酬を、在宅は月 28,000 円・施設などは月 18,000 円に月数を掛けた額まで
      - 報酬の助成は、報酬が決まった日から 1 年以内に申請する
    sources:
