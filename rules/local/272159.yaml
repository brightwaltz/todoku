  - template: local-kaigo-yohin
    status: found
    name: 家族介護用品の支給（家族介護支援事業）
    where: 高齢介護室（総務・地域支援担当）。郵送でも申請できる
    conditions:
      - 要介護 3・4・5 の人を介護している家族。本人も介護者も市内に住所がある
      - 本人の世帯と介護者の世帯が、どちらも市民税非課税。生活保護を受けている人は対象外
      - 紙おむつ・尿取りパッド・使い捨て手袋などを、月 1 回家に届ける
      - 毎月 8 日（土日祝はその前日）までに申請すると、その月から届く
      - 品物ごとの金額の決まりと、宅配のときに払う額は窓口で確かめる
