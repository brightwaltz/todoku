  - template: local-iro
    status: found
    name: 家族介護慰労金
    where: 大阪市福祉局 高齢者施策部 地域包括ケア推進課（問い合わせると申請書類が自宅に届く）
    conditions:
      - 介護する人も介護される人も、1年以上続けて市内に住んでいること
      - 同居か同じ敷地・隣地に住んで介護している家族など
      - 1年以上要介護4か5で、その間介護保険サービスを使っていないこと（年7日以内のショートステイは可）
      - サービスを使っていない期間、両方の世帯が市民税非課税であること
      - 年10万円。申請は代表者1人で、地域包括支援センターが家を訪ねて確かめる
    sources:
      - url: https://www.city.osaka.lg.jp/fukushi/page/0000682148.html
