  - template: local-haishoku
    status: found
    name: 生活支援型食事サービス事業
    where: 住まいの地域に配達できる市の委託配食事業者を1か所選んで電話で申し込み、申請書を出す（市が審査）
    conditions:
      - 要支援1・2か要介護1〜5で、ひとり暮らしや要介護者などだけの世帯
      - 買い物や調理ができず食事の確保が難しく、配食での安否確認が必要なこと
      - ケアマネジャーなどがケアプランなどにこのサービスを載せていること
      - 昼食か夕食を届けて安否を確かめる。食事代は自己負担
      - 低所得で支払いが難しい世帯は、1食あたりの負担の軽減がある
    sources:
      - url: https://www.city.osaka.lg.jp/fukushi/page/0000006603.html
        publisher: 大阪市
        title: 生活支援型食事サービス事業
        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-05
    review: {read_by: "Managed Agent（Opus 5.5）", recheck: match, date: 2026-11-05}
  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業（市長申立て・後見人等の報酬の助成）
    where: 住まいの区の保健福祉センター（高齢者福祉の担当）。市長申立ての案件は申立てをした区の保健福祉センター
    conditions:
      - 市長申立ては、判断能力が不十分で、身寄りがないなどで親族が申し立てられない人
      - 市長申立ての費用は、市が一部または全部を負担する
      - 報酬助成は、生活保護を受けている人やそれに準じる人で、報酬を払うのが難しい人
      - 本人・親族の申立ての場合も対象。報酬付与の審判から3か月以内に申請
      - 上限は月額で在宅2万8千円、施設入所1万8千円
    sources:
      - url: https://www.city.osaka.lg.jp/fukushi/page/0000369915.html
