  - template: local-kaigo-yohin
    status: found
    name: 介護用品の給付
    where: 要介護高齢者の住民登録がある区の保健福祉センター福祉業務担当（高齢者福祉）。一部は行政オンラインシステムでも可
    conditions:
      - 要介護4か5、または要介護3で排尿・排便のどちらかが全介助の高齢者が対象
      - その人を家で介護している、市内に住む家族が申請する（1人だけ）
      - 介護される人の世帯も、介護する人の世帯も市民税非課税であること
      - 月6,500円分の給付券を、申請月に応じて年最大12枚。7月〜翌6月で毎年更新
      - 券はカタログの品と交換し、配達時に在宅かどうかを確かめられる
    sources:
      - url: https://www.city.osaka.lg.jp/fukushi/page/0000683299.html
        publisher: 大阪市
        title: 介護用品の給付
        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-05
    review: {read_by: "Managed Agent（Opus 5.5）", recheck: match, date: 2026-11-05}
  - template: local-haikai
    status: found
    name: 認知症高齢者等見守りネットワーク事業
    where: 住まいの地域を担当する見守り相談室
    conditions:
      - 認知症で行方不明になるおそれのある人の氏名・特徴・顔写真などを事前に登録
      - 登録した人には、服や靴に貼れる見守りシール・アイロンシールを渡す
      - 行方不明時は、見守り相談室が地域の協力者にメールで情報を流す
      - あわせてGPS端末の貸与（位置情報探索事業）がある。月1,320円
      - GPSの月額は、申請者と本人の世帯がどちらも市民税非課税なら減免
    sources:
      - url: https://www.city.osaka.lg.jp/fukushi/page/0000581171.html
