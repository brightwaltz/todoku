  - template: local-kaigo-yohin
    status: found
    name: 介護用品の支給
    where: 高齢福祉課（本庁舎1階）か各総合支所の総合サービス課。申請書にケアマネジャーが書く欄がある
    conditions:
      - 市の介護保険の被保険者で、家で暮らしている要介護1〜5の人
      - いつも失禁などがあり、介護用品が要る
      - 介護保険料が第1〜第3段階（市民税非課税）で、生活保護を受けていない
      - 月の上限は要介護1〜3が2,500円、4〜5が5,000円（超えた分は自分で払う）
      - 紙おむつ・紙パンツ・尿取りパッド。申請した翌月の分から
    sources:
      - url: https://www.city.yamaguchi.lg.jp/site/korei/4719.html
