  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業（報酬の助成）
    where: 高齢福祉課 成年後見センター（山口総合支所1階）
    conditions:
      - 家庭裁判所で後見人などが選ばれている人
      - 生活保護を受けているか、すぐ現金にできる資産が合わせて50万円以下
      - 月の上限は在宅28,000円・施設18,000円（家庭裁判所が決めた報酬の範囲）
      - 報酬を決める審判の日から6か月以内に、本人か後見人などが申請する
