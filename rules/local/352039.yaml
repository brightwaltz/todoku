  - template: local-haishoku
    status: found
    name: 生活支援型給食サービス
    where: 住んでいる地域の地域包括支援センター
    conditions:
      - 昼か夕の1食を届け、そのときに安否を確かめる
      - 要支援1・2の人や、自分で調理できないおおむね65歳以上の人など（区分が3つある）
      - 自己負担は1食310〜510円
