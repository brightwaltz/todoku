  - template: local-iro
    status: found
    name: 家族介護慰労金
    where: 介護保険課 介護給付担当（山口総合支所1階）
    conditions:
      - 本人と介護する家族が市に住み、本人が要介護3以上
      - 同居の家族が家で介護し、介護保険サービスの利用が合わせて10日以内
      - 両方の世帯の全員が市民税非課税で、保険料の滞納が無い
      - 年10万円。対象の期間が終わった次の日から1年以内に申請する
