  - template: local-koken
    status: found
    name: 岡山市成年後見制度利用助成金支給事業（後見人等の報酬の助成）
    where: 福祉援護課
    conditions:
      - 岡山市から生活保護または中国残留邦人等の支援給付を受けている人
      - 市内に住み、世帯の年間収入見込みが150万円以下（世帯員1人ごとに50万円加算）
      - 世帯の預貯金等も同じ基準以下で、負担能力のある人に扶養されていないこと
      - 配偶者や4親等内の親族が後見人等なら対象外。報酬付与の審判から3か月以内に申請
      - 助成の上限は在宅で月2万8千円、施設入所で月1万8千円
