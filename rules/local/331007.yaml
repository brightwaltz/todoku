  - template: local-iro
    status: found
    name: 家族介護者慰労金
    where: もよりの福祉事務所、または御津・灘崎・建部・瀬戸の各支所の総務民生課
    conditions:
      - 65歳以上で要介護3以上の認定が1年以上続いている人を、在宅で介護する人
      - 要介護者と同居し、年度内（4月〜3月）に通算6か月以上介護していること
      - 要介護者が前の1年間、市内に住み、介護保険サービスを使っていないこと
      - 介護者と要介護者が市内に住み、同居する人全員が市民税非課税であること
      - 年額10万円。要件を満たした年度の10月1日〜3月31日に申請する
    sources:
