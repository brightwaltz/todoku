  - template: local-haishoku
    status: found
    name: まごころ給食サービス（民間業者による配食）
    where: 高齢者福祉課、またはもよりの地域包括支援センター（頁の問い合わせ先）
    conditions:
      - 65歳以上の虚弱な人などで、自分で調理できない、または援助を受けられない人
      - ひとり暮らしや高齢者だけの世帯などが対象。利用前に関係者が会って調査する
      - 平日の昼食を1日1食、民間業者が自宅へ届ける。利用料は1食400円
      - ひまわり給食サービス（地域ボランティアの配食）を使えない地区の人が対象
