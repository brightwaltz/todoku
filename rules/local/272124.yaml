  - template: local-haikai
    status: found
    name: 徘徊高齢者家族支援事業（徘徊高齢者SOSネットワーク）
    where: 健康福祉部 高齢介護課か、近くの高齢者あんしんセンター
    conditions:
      - 認知症などで徘徊のおそれのある高齢者の写真・特徴・連絡先を、前もって市に登録する（無料）
      - 行方が分からなくなったら関係機関が協力して探す。登録した人に見守りグッズを配る
      - 希望する人には GPS の利用を支援する。月の使用料は 1,200 円、充電器は 2,500 円など（税別）
      - 警備会社の捜索員の出動は 1 回 10,000 円（税別）。市の助成の有無と額は頁に無いので確かめる
      - 年齢や要介護度などの条件は頁に無いので、窓口で確かめる
