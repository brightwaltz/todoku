  - template: local-kaigo-yohin
    status: found
    name: 家族介護用品支給
    where: 健康福祉部 高齢介護課か、近くの高齢者あんしんセンター
    conditions:
      - 介護される人と介護する家族がともに市に住民登録し、同居の家族を家で介護している（世帯分離も含む）
      - 介護される人を含む家族全員（世帯分離も含む）が、その年度の市民税が非課税
      - 要介護 4・5、または要介護 3 で認定調査票の排尿か排便が「見守り等」「一部介助」「全介助」
      - 月に要介護 3 は 5,000 円、4・5 は 6,000 円まで、紙おむつなどを市の契約業者が家に届ける
      - 施設に入所中・入院中は対象外。申請書と家族全員分の課税状況調査同意書を出す
