  - template: local-haikai
    status: found
    name: 倉敷市安心おかえりシール・認知症GPS端末購入費等補助金の助成
    where: 健康長寿課 地域包括ケア推進室。シールは水島・児島・玉島支所の福祉課と真備支所の真備保健福祉課でも申請できる
    conditions:
      - シール：在宅の人で、認知症の診断で行方不明のおそれがあるか、警察などに保護されたことがある
      - 家族か介護者が申請し、QR コード付きのシールを 50 枚無料でもらう。印鑑とスマートフォンを持っていく
      - GPS：市内に住む在宅の 40 歳以上で、要介護・要支援の認定か認知症の診断があり、保険料の滞納がない
      - 行方不明になったことがあるか、そのおそれがある。端末の購入費かレンタル初月分を 10,000 円まで
      - GPS は買う前・借りる前に申請する。後からの申請は受け付けない
