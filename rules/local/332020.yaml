  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業（後見人などの報酬の助成）
    where: 社会福祉部 福祉援護課
    conditions:
      - 介護保険か障がい福祉のサービスを使える人で、後見人などへの報酬を払えないときに一部を助成する
      - 生活保護か、単身は年収見込みと資産がどちらも 150 万円以下（2 人以上の世帯は 200 万円以下）
      - 上限は月 28,000 円（施設に入っている人は月 18,000 円）。後見人などが親族なら対象外
      - 報酬を決めた審判の日から 1 年以内に申請する。本人や親族が申し立てた場合も対象
      - 申立て費用の助成は頁に無い。身寄りがないときなどは市長が申し立てる
