  - template: local-iro
    status: found
    name: 介護手当の支給・家族介護慰労金の支給
    where: 健康長寿課か、水島・児島・玉島支所の福祉課、真備支所の真備保健福祉課（介護者の住む地区で決まる）
    conditions:
      - 介護手当：65 歳以上のねたきりか認知症の人を家で 6 か月以上介護する人に年 40,000 円
      - 入院・施設入所・ショートステイなどの期間は 6 か月に数えない。所得の条件は頁に書かれていない
      - 慰労金：要介護 4・5 の認定から 1 年以上たち、申請前の 1 年に介護保険のサービスを使っていない
      - 慰労金は市民税非課税の世帯で、申請前の 1 年に 3 か月以上の入院・入所が無い。年 100,000 円
      - 2 つは重ねて受けられない。申請書・民生委員の状況調査票・医師の診断書を出す
