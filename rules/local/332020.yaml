programs:
  - template: local-kaigo-yohin
    status: found
    name: 介護用品（紙おむつ等）の支給
    where: 健康長寿課か、水島・児島・玉島支所の福祉課、真備支所の真備保健福祉課（介護者の住む地区で決まる）
    conditions:
      - 家で介護する人の紙おむつなどの購入費を助成する。買う前に申請し、入院・入所中は対象外
      - 区分1：6 か月以上ねたきりか認知症の 65 歳以上の人、重度身体障がいの人を介護。上限 30,000 円
      - 区分1 は本人と介護者の両方の世帯に所得税の課税者がいない。領収書を出すと口座に振り込む
      - 区分2：要介護 4・5 の人を介護し、両方の世帯に所得税・市民税の課税者がいない。上限 75,000 円
      - 区分2 は決定通知と認印を持って見積りの業者から受け取る。額は決定した月で変わる
    sources:
      - url: https://www.city.kurashiki.okayama.jp/fukushi/elderly/1004318/1004325.html
