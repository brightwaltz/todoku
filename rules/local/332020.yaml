  - template: local-haishoku
    status: found
    name: 給食サービス（高齢者等給食サービス事業）
    where: 担当のケアマネジャーが調べて市へ申請する。いなければ地区の高齢者支援センター。問い合わせは健康長寿課か各支所の福祉課
    conditions:
      - 調理・買い物が難しい在宅の人で、65 歳以上のひとり暮らしか、65 歳以上だけの世帯の人など
      - 障がい者手帳を持つ人や、昼間ひとりなどになる人も対象。65 歳未満の要介護の人もこれに準じる
      - 調理したことがなく作れない人や、治療食が要る人は対象にならない
      - 昼食の弁当を 1 日 1 回届けて安否を確かめる。1 食 430 円の負担で、年末年始は休み
      - 決定の通知が届いたら、指定の弁当業者を 1 つ選んで連絡する
    sources:
