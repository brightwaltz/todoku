  - template: local-kaigo-yohin
    status: found
    name: 紙おむつ購入費の支給（介護保険の市独自のサービス）
    where: 保健福祉部 高齢福祉課。振込の申請は保健と福祉の総合相談窓口・地区市民センター・出張所でも出せる
    conditions:
      - 市の介護保険の被保険者で要介護 1〜5 の人。施設・病院・ショートステイに入っている間は除く
      - 大人用紙おむつ・尿取りパッドなどの購入額 月 5,500 円まで。負担割合に応じてその 9〜7 割
      - 市に登録した事業者の宅配か、店で買って領収証で申請する振込かを選ぶ（両方使っても月 5,500 円まで）
      - 振込は申請の翌月。要支援の期間に買った分と、2 年を過ぎた領収証は対象外
    sources:
