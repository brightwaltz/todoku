  - template: local-haikai
    status: found
    name: 認知症高齢者地域生活安心サポート事業・はいかい高齢者等の位置探索システム利用助成・認知症事故救済事業
    where: 保健福祉部 高齢福祉課
    conditions:
      - 認知症で行方不明のおそれがある市民に、二次元コード付きの見守りグッズを無料で配る
      - 捜索支援アプリ「オレンジセーフティネット」は、家族などが前もって市に登録すると無料で使える
      - GPS：在宅の 65 歳以上（若年性認知症を含む）か知的障がいの人を介護する、市税の滞納のない家族
      - GPS は協定事業者との契約で、初回の登録料と月の利用料の半額を助成（上限 6,000 円・月 4,000 円）
      - 要件にあう要介護の人とグッズの申請者は、市が保険料を払う認知症の事故の保険に入る（賠償は 2 億円まで）
