  - template: local-haishoku
    status: found
    name: 食の自立支援事業（配食サービス）
    where: 保健福祉部 高齢福祉課（相談支援グループ）
    conditions:
      - 在宅のひとり暮らしか高齢者だけの世帯で、低栄養のおそれがある 65 歳以上の人
      - おおむね 65 歳以上で、要支援・要介護や病気などで調理が難しい人も
      - 食事を届ける。状況の調査で週 1〜5 食を決める
      - 1 食 450 円（生活保護の世帯は 400 円）
    sources:
