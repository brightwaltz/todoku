  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業（市長による申立て・費用の助成）
    where: 高齢者は高齢福祉課（相談支援グループ）。知的障がいは障がい福祉課、精神障がいは保健所保健予防課
    conditions:
      - 身寄りがないなど申し立てる人がいないとき、市長が申し立てることがある
      - 助成：生活保護か、市民税非課税で年収 150 万円以下・預貯金など 50 万円以下の人など
      - 申立ての費用（印紙・切手・診断書・鑑定など）は、審判の日の翌日から 60 日以内に申請
      - 後見人などの報酬は月 28,000 円まで（施設は 18,000 円）。報酬の審判の翌日から 1 年以内に申請
    sources:
