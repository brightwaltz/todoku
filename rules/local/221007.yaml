        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-05
    review: {read_by: "Managed Agent（Opus 5.5）", recheck: match, date: 2026-11-05}
  - template: local-iro
    status: found
    name: 家族介護慰労金支給
    where: 各区の高齢介護課（葵区・駿河区・清水区）、蒲原出張所（2回目以降は電子申請も可）
    conditions:
      - 要介護4か5の認定から1年以上たつ65歳以上の人を、在宅で介護する同居の家族
      - 生活保護世帯か、世帯全員が市民税非課税の世帯
      - 1年以上介護保険サービスを使っていない（年1週間ほどの短期入所などは除く）
      - 市に住民登録があり、住んでいること
      - 年間10万円を支給
    sources:
