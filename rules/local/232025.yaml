  - template: local-koken
    status: found
    name: 岡崎市成年後見制度利用支援事業
    where: 長寿課 地域支援係か、障がい福祉課 審査給付係に申請（問い合わせはふくし相談課）
    conditions:
      - 生活保護か中国残留邦人等の支援給付を受けている人、または次の行の線に当たる人
      - 市民税非課税・年収 150 万円以下・預貯金 350 万円以下で、ほかに使える資産も扶養する親族も無い
      - 申立ての費用（切手・印紙・診断書・鑑定・戸籍など）を助成。上限は頁に無い
      - 後見人の報酬は月 2.8 万円まで（施設や病院に 1 か月を通していたら 1.8 万円まで）
      - 審判が決まった日の翌日から 90 日以内に申請する
