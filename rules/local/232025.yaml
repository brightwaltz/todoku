  - template: local-haishoku
    status: found
    name: ひとり暮らし高齢者見守り配食サービス
    where: 長寿課 地域支援係（窓口か郵送）。地域包括支援センターかケアマネジャーが代わりに出せる
    conditions:
      - 75 歳以上で本当にひとりで暮らし（世帯を分けただけは不可）、市民税が非課税
      - 2 親等以内の親族が隣の建物に住むか、日ごろ行き来して見守れるときは対象外
      - 昼か夕の 1 日 1 食を手渡しし、安否を確かめる（会えないときは緊急連絡先へ）
      - 自己負担はふつうの食事で 1 食 350 円。市が指定した事業者に限る
      - 1〜15 日に届けば 16 日、16 日〜月末なら翌月 1 日に利用が決まる
    sources:
