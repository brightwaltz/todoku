  - template: local-kaigo-yohin
    status: found
    name: 家族介護用品購入助成券（おむつ券）
    where: 長寿課 地域支援係（福祉会館 1 階）。地域包括支援センターかケアマネジャーが代わりに出せる
    conditions:
      - 在宅で要介護 3〜5（要介護 3 は追加の要件あり）、おむつを使い、本人の市民税が非課税
      - 入院・入所・ショートステイの日を除いて、家にいる日が月 10 日以上
      - 指定の店で使うおむつ券（1 か月 1 枚・1 枚 2,700 円）。年に 12 枚まで
      - その月のおむつ代 3,000 円ごとに 1 枚使える（3,000 円に届かない月は使えない）
      - 毎月 1 日〜月末に申請（必着）。9 月と 3 月に届く確認書を出すと続く
    sources:
