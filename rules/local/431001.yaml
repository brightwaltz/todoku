  - template: local-haikai
    status: found
    name: 熊本市認知症高齢者等見守りSOSネットワーク事業
    where: お住まいの区役所の福祉課（前もって電話で相談する）
    conditions:
      - 行方不明になるおそれがあり、在宅で暮らす認知症の高齢者などが対象
      - 認知症の診断がある人（65歳未満も含む）、または認知症が疑われる症状のある人
      - 名前・特徴・写真などを前もって市に登録し、行方不明のときは関係機関に知らせる
      - 登録した人は、希望すればQRコードの見守りシール（どこシル伝言板）ももらえる
      - 登録もシールも無料（シールを追加で頼むときは費用がかかる）
