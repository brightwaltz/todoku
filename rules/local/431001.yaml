    name: 熊本市成年後見制度利用支援事業
    where: 高齢者は高齢福祉課、障がいのある人は障がい福祉課（まず電話で相談する）
    conditions:
      - お金の事情などで成年後見制度を使うのが難しい人が対象
      - 本人や親族による申立てが見込めず、放っておけないときは市長が申し立てる
      - 市長が申し立てた人のうち、生活保護を受けている人などは申立ての費用を市が負担する
      - 後見人などへの報酬を払うのが難しい人には、報酬の全部か一部を助成する
