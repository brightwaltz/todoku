  - template: local-haishoku
    status: found
    name: 訪問給食事業
    where: 最寄りの在宅介護支援センター。事業の問い合わせ先は健康福祉部 高齢福祉課
    conditions:
      - 65歳以上か、40〜64歳で要介護・要支援の人で、自分で食事を作るのが難しい人
      - ひとり暮らしか、同居の家族が皆調理できず、見守りが要る世帯
      - 月曜から土曜の昼と夕に届く。1食688円のうち本人の負担は500円
      - 所得の条件は頁に無いので、問い合わせて確かめる
