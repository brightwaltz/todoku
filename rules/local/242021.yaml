  - template: local-iro
    status: found
    name: 家族介護慰労事業
    where: 健康福祉部 高齢福祉課
    conditions:
      - 要介護4以上の高齢者を家で介護している家族で、世帯が市民税非課税
      - 1年間、介護保険のサービスを使わず、入院や施設への入所も無かった（1週間ほどの短期入所や入院は除く）
      - 慰労金は10万円
      - 申し込みの時期と持ち物は頁に無いので、問い合わせて確かめる
