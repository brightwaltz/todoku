programs:
  - template: local-haikai
    status: found
    name: はいかい高齢者家族支援サービス助成事業
    where: 地域包括ケア推進課 高齢者福祉担当、福祉政策課篠ノ井分室、各支所の窓口
    conditions:
      - 市内に住む 65 歳以上で、はいかい行動のある認知症の人（要支援 1〜要介護 5 の認定を受けた人か、事業対象者）
      - その人を在宅で、または通いで介護している人が申し込む
      - GPS 機能の付いた端末を新しく買う費用を助成する。初期費用は 8,000 円、月の利用料は 700 円まで
      - どちらも対象の費用の 10 分の 10 以内。解約金は対象外
      - 利用申込書・利用同意書・請求書・廃止届の様式がある。期限は頁に無いので、窓口で確かめる
