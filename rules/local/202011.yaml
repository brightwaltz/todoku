  - template: local-iro
    status: found
    name: 在宅福祉介護料（要介護高齢者用）
    where: 地域包括ケア推進課 高齢者福祉担当（第二庁舎 1 階）か各支所の窓口
    conditions:
      - 市内に 1 年以上住む 65 歳以上で要介護 3〜5 の人を、家で介護している人
      - 基準日（7 月 1 日か 1 月 1 日）の前の 1 年間に、家での介護が通算 180 日以上
      - 年額で、要介護 4・5（第 1 種）は 35,000 円、要介護 3（第 2 種）は 25,000 円。口座に振り込む
      - 申請は 7 月か 1 月の 1〜31 日。7 月の申請は 9 月、1 月の申請は 3 月に支給（重ねては受けない）
      - 基準日の前日までの死亡・市外転出、前日より前からの施設入所（ショートステイを除く）は対象外
    sources:
      - url: https://www.city.nagano.nagano.jp/n101200/contents/p002391.html
