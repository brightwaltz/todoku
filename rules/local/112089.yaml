  - template: local-haishoku
    status: found
    name: 高齢者配食サービス
    where: まず地域の地域包括支援センターに電話で相談する。事業の問い合わせ先は福祉部 高齢者支援課
    conditions:
      - 市に住む65歳以上の人
      - 市に申し込むのでなく、市の指定業者から選んで直接契約する。配達のときに安否も確かめる
      - 市の補助は頁に無く、料金は業者ごとに違う
      - 回数や世帯・所得の条件は頁に無いので、問い合わせて確かめる
