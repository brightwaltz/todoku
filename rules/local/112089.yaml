city: "112089"
name: 所沢市
site: city.tokorozawa.saitama.jp
# T-131：読む1 と読む2 が kaigo-yohin・haikai・haishoku・koken の 4 型で合った。
# haishoku は市の補助が頁に無く、市の指定業者と直接契約する形。配達のときに安否確認があるので型に当たるとし、補助が無いことを条件に書く。
# koken は読む1 が申請書の頁、読む2 が案内の頁を開いた。同じ事業・同じ窓口で食い違いが無いので、出典に 2 頁とも書く。
# iro は読む1 が not_found、読む2 が特定在宅高齢者介護手当を見つけて合わないので入れない（もう一度読めば入れられる候補）。
programs:
  - template: local-kaigo-yohin
    status: found
    name: 紙おむつ購入費支給事業
    where: 福祉部 介護保険課（窓口・郵送・電子申請）
    conditions:
      - 市の介護保険に入っていて、家で暮らす要介護2〜5の人（他の市の保険証は対象外）
      - 要支援1・2と要介護1でも、医師がおむつが要ると判断すれば相談できる
      - 上限は月5,600円。負担割合証の割合が自己負担で、上限を超えた分は全額自己負担
      - 市の指定事業者から選ぶ。月の最終営業日までの申し込みで翌月に届く
      - 所得の条件と持ち物は頁に無いので、問い合わせて確かめる
    sources:
      - url: https://www.city.tokorozawa.saitama.jp/kenko/kaigohoken/kaigo4/kyuufu_kamiomutu.html
        publisher: 所沢市
        title: 介護保険 紙おむつ購入費の支給
        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-06
    review: {read_by: "rule-reader（Sonnet 5.5）、照らし直しは rule-reader（Sonnet 5.5）", recheck: match, date: 2026-11-06}
  - template: local-haikai
    status: found
    name: トコろんおかえりQR（みまもり支え合い事業）
    where: 福祉部 高齢者支援課。無料の分は最寄りの地域包括支援センターで受け取る（前もって問い合わせる）
    conditions:
      - 道に迷うおそれのある高齢者の持ち物に貼る QR シール。読んだ人から家族へ連絡が届く
      - 家族などのメールを3件まで登録でき、有効は1年
      - 1シート990円。認知症で道に迷ったことのある人は無料になる場合がある
      - 無料になる細かい条件は頁に無いので、問い合わせて確かめる
    sources:
