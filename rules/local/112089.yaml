  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業
    where: 本人が65歳以上なら福祉部 高齢者支援課（前もって相談し、持参か郵送）
    conditions:
      - 後見人などへの報酬を払うのが難しい人に、報酬の全部か一部を助成する。申し立ての費用の助成もある
      - 助成は家庭裁判所が決めた額の範囲で、市の要綱の範囲内
      - 申し立ての費用は開始の審判の日から、報酬は付与の審判の日から、2か月以内に申請する
      - 上限額・所得の基準・市長の申し立ては頁に無いので、問い合わせて確かめる
