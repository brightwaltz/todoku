  - template: local-haishoku
    status: found
    name: 配食サービス
    where: 京都市社会福祉協議会、または保健福祉局 介護ケア推進課に相談（担当のケアマネジャーがいれば、まずケアマネジャーに相談）
    conditions:
      - 60歳以上で、ひとり暮らしか高齢者だけの世帯の人
      - 要支援か要介護の認定を受け、体の状態などで買物や調理が難しい人など
      - 昼食を届け、あわせて安否を確かめる
      - 利用料は1食500円まで（事業者により異なる）
    sources:
      - url: https://www.city.kyoto.lg.jp/hokenfukushi/cmsfiles/contents/0000355/355208/GB2026.pdf
        publisher: 京都市
        title: 令和8年度版「すこやか進行中!!～高齢者のためのガイドブック～」（配食サービスの頁）
        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-05
    review: {read_by: "Managed Agent（Opus 5.5）", recheck: match, date: 2026-11-05}
  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業（申立費用・報酬支給）
    where: 65歳以上の人の費用支給は保健福祉局 介護ケア推進課（持参か郵送）。身寄りのない人の市長申立ては同課か区役所・支所の健康長寿推進課に相談
    conditions:
      - 市長申立て：判断力が不十分で、申し立てる2親等内の親族などがいない人
      - 費用支給は本人や親族の申立ても対象。申立費用と後見人等の報酬を支給
      - 本人（申立費用は申立人も）が生活保護等か非課税世帯で、預貯金が基準以下・他の資産なし
      - 報酬の上限は月2.8万円（在宅）、月1.8万円（施設）
      - 後見人等が本人の4親等内の親族なら、報酬は支給の対象外
    sources:
      - url: https://www.city.kyoto.lg.jp/hokenfukushi/page/0000296370.html
        publisher: 京都市
        title: 成年後見制度利用支援事業（申立費用・報酬支給）について
