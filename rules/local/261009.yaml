  - template: local-kaigo-yohin
    status: found
    name: 家族介護用品給付事業（家族介護用品給付券の交付）
    where: 介護保険被保険者証の住所地の区役所・支所の健康長寿推進課（高齢介護保険担当）、または右京区京北出張所（保健福祉第一担当）
    conditions:
      - 市内に住み実際に暮らす65歳以上で、要介護4か5の人を介護する家族など
      - 自宅で介護されていること（軽費・有料老人ホーム、サ高住も自宅に含む）
      - 世帯が市民税非課税であること
      - 紙おむつなどと交換できる給付券（1枚5千円相当）。申請が早い月ほど多い
      - 毎年度の申請が必要
    sources:
      - url: https://www.city.kyoto.lg.jp/hokenfukushi/page/0000324770.html
        publisher: 京都市
        title: 令和8年度京都市家族介護用品給付券の交付について
        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-05
    review: {read_by: "Managed Agent（Opus 5.5）", recheck: match, date: 2026-11-05}
  - template: local-haikai
    status: found
    name: 高齢者あんしんお出かけサービス事業（小型GPS端末機の貸出）
    where: 区役所・支所の健康長寿推進課 高齢介護保険担当、または京北出張所 保健福祉第一担当
    conditions:
      - 要介護か要支援の認定を受け、認知症で外出時に戻れなくなるおそれがある人
      - その人を自宅で介護している家族などが利用する
      - 居場所を調べられる小型GPS端末機を貸し出す
      - 利用料は月1,500円。生活保護世帯などは無料
    sources:
