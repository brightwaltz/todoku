  - template: local-haishoku
    status: found
    name: さいたま市在宅高齢者等宅配食事サービス事業
    where: お住まいの区の社会福祉協議会事務所（市がさいたま市社会福祉協議会に委託）
    conditions:
      - 市内に住む、おおむね65歳以上のひとり暮らしや高齢者だけの世帯など
      - 自分で調理や買い物をするのが難しく、家族などから食事を受けられない人
      - 夕食を届け、あわせて安否を確かめる。月〜金の週5回まで（祝日・年末年始を除く）
      - 費用は1食400円
    sources:
