  - template: local-kaigo-yohin
    status: found
    name: 重度要介護高齢者紙おむつ等支給事業
    where: お住まいの区の区役所高齢介護課高齢福祉係（電子申請もできる）
    conditions:
      - 市内に住む65歳以上で、いつもおむつを使っている、市の介護保険の被保険者
      - 要介護3〜5。要介護3は認定調査の排尿か排便が「介助」か「見守り等」の人
      - 介護保険料の段階が第1〜第5段階で、保険料の滞納がない人
      - 生活保護等を受けていない、介護保険施設に入所していない、入院が3か月以内
      - 月6,000円（税込）までの利用券で受け取る。超えた分は自己負担
    sources:
