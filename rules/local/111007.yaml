  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業
    where: お住まいの区の区役所高齢介護課
    conditions:
      - 65歳以上で、2親等内の親族がいない・音信不通などで親族が申し立てられない人は、市長が申し立てる
      - 市長申立ての費用（申立手数料・鑑定料など）は市が先に負担し、払える人には後で請求
      - 報酬助成は、市長申立てか、本人・親族申立てで親族でない第三者が後見人等になった人
      - 生活保護を受けているなど報酬の負担が難しい人。上限は在宅月28,000円、施設月18,000円
      - 報酬助成は、報酬付与の審判が確定した翌日から2か月以内に申請
    sources:
