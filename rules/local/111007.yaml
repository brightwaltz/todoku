    status: found
    name: さいたま市徘徊見守りSOSネットワーク
    where: 本人が住む区の区役所高齢介護課（事前登録）
    conditions:
      - 認知症などで徘徊する、またはそのおそれのある高齢者など
      - 家族などが申請し、氏名・特徴・写真などを前もって登録しておく
      - 行方不明になったら、市が登録情報を協力機関に送り、発見への協力を頼む
