programs:
  - template: local-kaigo-yohin
    status: found
    name: 紙おむつ等介護用品の給付
    where: 各区役所の高齢・障害課（高齢者支援係。川崎区は高齢者支援担当）
    conditions:
      - 65歳以上で在宅、要介護3〜5の認定があり、紙おむつが必要な人
      - 40〜64歳は要介護3〜5で、初老期の認知症（若年性認知症）に当たり、紙おむつが要る人
      - 施設に入っている人、1か月に及ぶ入院中の人は対象にならない
      - 有料老人ホームなど介護や食事の提供を受ける住まいは施設とみなす
      - 月6,000円まで注文でき負担は課税状況で0〜20%。生活保護の人は月3,000円で紙おむつ類は対象外
    sources:
      - url: https://www.city.kawasaki.jp/350/page/0000022608.html
        publisher: 川崎市
        title: 紙おむつ等介護用品の給付
        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-05
    review: {read_by: "Managed Agent（Opus 5.5）", recheck: fixed, date: 2026-11-05, note: "40〜64歳の条件に頁にある「紙おむつが必要」を足し、生活保護の人は上限が月3,000円で紙おむつ類が対象外という頁の記載を限度額の行に足した。"}
  - template: local-haikai
    status: found
    name: 認知症等行方不明SOSネットワーク
    where: 各区役所の高齢・障害課、または担当地区の地域包括支援センター
    conditions:
      - 市内に住み、認知症などで行方不明になるおそれがある人（若年性認知症も含む）
      - 写真を添えて事前に登録すると、貼って使うSOSネームプリントを無料で作ってもらえる
      - 行方不明になったら家族がSOS届を出し、区役所が関係機関に情報を伝える
      - 登録などの費用はかからない
    sources:
      - url: https://www.city.kawasaki.jp/350/page/0000022701.html
