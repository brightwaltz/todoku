  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業（審判請求費用・後見人等報酬助成）
    where: 本人65歳以上は健康福祉局地域包括ケア推進室、65歳未満は障害計画課（郵送・持参・オンライン）
    conditions:
      - 後見等の申立ての鑑定費用と、後見人などへの報酬を負担しにくい人への助成
      - 生活保護を受けている人など、または世帯全員が市民税非課税で収入・資産が基準内の人
      - 報酬の助成は月額上限があり、施設入所なら18,000円、在宅などは28,000円
      - 後見人が配偶者・直系血族（親・子・孫など）・兄弟姉妹か、市の市民後見人なら報酬助成は対象外
      - 鑑定費用は予納通知から、報酬は報酬付与の審判から3か月以内に申請
    sources:
