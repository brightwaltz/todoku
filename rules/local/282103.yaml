# T-131：読む1 と読む2 が kaigo-yohin・haikai の 2 型で、同じ頁・同じ数字で合った。
# haishoku・koken・iro は両方とも not_found だが、要綱・例規集・社協・成年後見支援センターを誰も開いていないので「市に無い」とは言えない。型ごと入れない。
programs:
  - template: local-kaigo-yohin
    status: found
    name: 介護用品の支給
    where: 高齢者支援課 高齢者福祉係（本館2階）
    conditions:
      - 市内に住み、要介護4か5の人と同居して介護している人
      - 市・県民税が非課税の世帯に限る
      - おむつや尿とりパッドを、月8,000円分まで現物で支給する。指定業者が毎月家に届ける
      - 申請書と、指定業者が作る見積書を出す。指定業者と品目は高齢者支援課に問い合わせる
    sources:
