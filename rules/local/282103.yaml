  - template: local-haikai
    status: found
    name: 認知症高齢者の見守りサービス
    where: 住む地区の地域包括支援センターに相談してから申請する（問い合わせは高齢者支援課 健やか長寿係）
    conditions:
      - 次のどれか1つに当たる人（所得の制限は無い）
      - 見守り・SOSネットワークに事前に登録している
      - 認知症の日常生活自立度がランク2以上
      - 地域包括支援センターなどの聞き取りで、認知症の症状があると認められた
      - 見守りタグを使う費用は市が全額負担する
