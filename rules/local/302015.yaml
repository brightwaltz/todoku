  - template: local-kaigo-yohin
    status: found
    name: 高齢者紙おむつ給付事業
    where: 住んでいる地区の地域包括支援センターに連絡する（職員が家に来て申請を代わりに行う。問い合わせは地域包括支援課）
    conditions:
      - 65 歳以上・要介護 1〜5 で、家で 3 か月以上寝たきりか、認知症で常に失禁している人
      - 生活保護の世帯か、市民税非課税の世帯
      - 新しく使う要介護 1〜3 の人は、認定調査で排尿か排便に介助や見守りが要るなどの条件が加わる
      - 利用料は無料。品目や量は頁に無いので、窓口で確かめる
