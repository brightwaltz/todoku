  - template: local-koken
    status: found
    name: 和歌山市成年後見制度利用支援事業（市長申立て・後見人等報酬助成）
    where: 高齢者・地域福祉課 高齢者・障害者成年後見センター（持参か郵送）
    conditions:
      - 本人が申し立てられず、4 親等内の親族がいないか音信不通などで頼れないときは、市長が申し立てる
      - 報酬の助成：本人の預貯金などで後見人等の報酬を払うのが難しい人（市長申立て以外も対象）
      - 後見人等が親族のときの報酬と、任意後見人の報酬は対象外
      - 令和 7 年 4 月 1 日以降に確定した報酬の審判が対象。確定から 1 年以内に申請する
