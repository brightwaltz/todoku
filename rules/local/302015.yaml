  - template: local-haishoku
    status: found
    name: 配食サービス
    where: 住んでいる地区の地域包括支援センターに連絡する（職員が家に来て申請を代わりに行う）
    conditions:
      - 65 歳以上で、高齢者などだけの世帯
      - 自分で食事を作るのが難しく、同居の人などから食事の手助けを受けにくい人
      - 定期的に食事を届け、あわせて安否を確かめる。負担は弁当代の実費（額は頁に無い）
