  - template: local-haikai
    status: found
    name: 認知症要配慮者見守り端末貸与事業（otta による見守りサービス）
    where: 地域包括支援課に貸与の申込書を出す（端末を用意するので、先に電話か問い合わせフォームで連絡する）
    conditions:
      - 認知症で外出に不安がある人を介護している人（市内の一般の住宅で暮らす人に限る）
      - 見守りの端末を 3 か月無料で借りられる。その後も使うなら運営会社と有料で契約する
      - 位置を見るスマートフォンが要り、通信料は自分で払う
      - 見守りの場所やアプリを入れた人の近くを通ると位置が残る仕組みで、GPS のようにいつも分かるわけではない
    sources:
