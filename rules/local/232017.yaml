programs:
  - template: local-haikai
    status: found
    name: とよはし高齢者等おかえり安心ネットワーク事業（豊橋おかえりネット）
    where: 最寄りの地域包括支援センター（担当のケアマネジャーを通してもよい）。問い合わせは長寿介護課
    conditions:
      - 市内に住み、認知症などで行方が分からなくなるおそれのある人（施設に入っている人も可）
      - 親族や後見人などが、登録カード（様式第1号）と本人の写真 2 枚（全身と顔）を出しておく
      - 前もって登録しておく仕組みで、GPS 端末の貸与や購入の助成は頁に無い
      - 費用と期限は頁に書かれていないので、窓口で確かめる
    sources:
      - url: https://www.city.toyohashi.lg.jp/18807.htm
        publisher: 豊橋市
        title: とよはし高齢者等おかえり安心ネットワーク事業
        license: 利用条件を確かめていない（引用しない）
