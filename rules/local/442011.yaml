  - template: local-haishoku
    status: found
    name: 食の自立支援事業
    where: 担当地域の地域包括支援センター（職員が訪問して調べる）
    conditions:
      - 65 歳以上のひとり暮らしか高齢者だけの世帯などで、体の衰えなどで調理が難しい世帯
      - 訪問の調査（アセスメント）の後、栄養のバランスがとれた食事を届ける
      - 週 6 回（食）まで。1 食 450 円の負担
