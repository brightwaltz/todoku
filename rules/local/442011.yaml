  - template: local-koken
    status: found
    name: 大分市成年後見人等報酬助成事業
    where: 福祉保健部 長寿福祉課
    conditions:
      - 後見人などへの報酬を払うのが難しい市内の人に、報酬の全部か一部を助成する
      - 預貯金などが 100 万円未満（単身は 50 万円未満）で、生活保護か、報酬を払うと保護の基準を下回る人など
      - 市長が申し立てた人に限らない。後見人などが配偶者か 4 親等内の親族なら対象外
      - 上限は月 28,000 円（施設に入っている人は月 18,000 円）
      - 報酬を決めた審判の日から 2 か月以内に、交付申請書と収支の申告書を出す
    sources:
