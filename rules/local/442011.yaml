  - template: local-iro
    status: found
    name: 家族介護慰労金支給事業
    where: 担当地域の地域包括支援センター（職員が訪問して調べる）
    conditions:
      - 要介護 4・5 の人を同じ世帯で 1 年以上家で介護している、市民税非課税世帯の家族
      - 介護される人は市内に 1 年以上住み、要介護 4・5 の状態が 1 年以上続いている
      - その 1 年の間、介護保険のサービスを使っていない（7 日以内のショートステイは除く）
      - 1 人あたり 100,000 円
