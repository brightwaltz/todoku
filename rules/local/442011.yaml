  - template: local-haikai
    status: found
    name: 大分あんしんみまもりネットワークの事前登録・大分市見守りシール
    where: 長寿福祉課（ネットワーク事務局）。登録は地域包括支援センターにも相談できる
    conditions:
      - 市に住民票があり市内の自宅に住む、認知症などで道に迷い行方不明になるおそれのある人
      - 物忘れだけでは登録できない。登録届・登録表・本人の顔写真を出す（郵送可）。無料
      - 登録すると、市が保険料を払う認知症高齢者等の個人賠償責任保険に自動で入る
      - シール：登録した本人か親族が長寿福祉課の窓口で申請し（郵送不可）、20 枚を無料で受け取る
    sources:
