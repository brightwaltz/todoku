  - template: local-kaigo-yohin
    status: found
    name: 介護用品購入費の助成・家族介護用品支給事業
    where: 購入費の助成は長寿福祉課（まず担当のケアマネジャーに相談）。家族介護用品は担当地域の地域包括支援センター
    conditions:
      - 購入費の助成：家で介護を受ける要介護 1〜5 の人で、常におむつが要ると市が認めた人
      - 紙おむつ・尿取りパッドなどの購入費の 9 割。購入額は年度 48,000 円まで
      - 買う前に受給資格を申請する（ケアマネジャーの証明が要る）。領収証は市の様式に限る
      - 家族介護用品：要介護 4・5 の人を同じ世帯で介護する、市民税非課税世帯の家族に年 10 万円まで
      - 家族介護用品は紙おむつ・手袋などの引換券を渡す。買った後は助成しないので先に相談する
    sources:
