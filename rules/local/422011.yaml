  - template: local-haishoku
    status: found
    name: 要介護者配食サービス
    where: お近くの総合事務所か地域包括支援センター
    conditions:
      - ひとり暮らしなどで、自分で食事を作るのが難しい高齢者
      - 食事を家に届け、届けるときに安否を確かめる
      - 利用者の負担は実費で、1 食 270〜620 円
      - 年齢・要介護度・所得の条件と、配達の回数は窓口で確かめる
    sources:
      - url: https://www.city.nagasaki.lg.jp/page/20026.html
