  - template: local-haikai
    status: found
    name: 徘徊高齢者等家族支援事業・徘徊高齢者等SOSネットワーク事業
    where: 各総合事務所の地域福祉課。担当は高齢者すこやか支援課
    conditions:
      - 認知症で行方が分からなくなるおそれのある高齢者と、その家族のための事業
      - 家族支援事業：行方不明のとき、家族に位置情報を知らせて早く見つけられるようにする
      - 行方不明の間の事故で家族が損害賠償の責任を負ったときは、保険で補う
      - SOS ネットワーク：前もって本人を登録し、行方不明のとき早く見つけて保護する
      - 機器の種類・自己負担・年齢などの条件は窓口で確かめる
    sources:
      - url: https://www.city.nagasaki.lg.jp/page/5951.html
        publisher: 長崎市
        title: 認知症への取り組み
        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-07
    review: {read_by: "rule-reader（Sonnet 5.5）、照らし直しは rule-reader（Sonnet 5.5）", recheck: match, date: 2026-11-07}
  - template: local-iro
    status: found
    name: 介護者慰労金支給
    where: お近くの総合事務所（中央・東・南・北）。担当は高齢者すこやか支援課
    conditions:
      - 寝たきりの高齢者を家で介護している家族に、年 100,000 円を支給する
      - 介護される人が要介護 4 か 5 で、市民税非課税の世帯
      - 申請前の 6 か月（入院の期間を除く）に介護保険のサービスを使っていない
      - 1 か月ほどのショートステイは、使っていてもよい
      - 申請の時期と書類は窓口で確かめる
    sources:
