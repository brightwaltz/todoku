programs:
  - template: local-kaigo-yohin
    status: found
    name: 家族介護用品支給
    where: お近くの総合事務所（中央・東・南・北）。担当は高齢者すこやか支援課
    conditions:
      - 寝たきりの高齢者などを家で介護している家族
      - 世帯の市民税が非課税で、介護される人が要介護 3 以上。ほかの要件は窓口で確かめる
      - 紙おむつ・尿取りパッド・使い捨て手袋・防水シーツなどを、品物で支給する
      - 利用料は無料で、支給は月 5,000 円分まで
      - 申請の時期と書類は窓口で確かめる
    sources:
      - url: https://www.city.nagasaki.lg.jp/page/1426.html
        publisher: 長崎市
        title: 自宅で介護されている家族のかたに
