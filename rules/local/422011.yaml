  - template: local-koken
    status: found
    name: 成年後見人等の報酬助成
    where: 高齢者すこやか支援課か障害福祉課。市長申立ての相談は長崎市権利擁護・成年後見支援センター
    conditions:
      - 後見人などへの報酬を払うのが難しい所得の低い人に、市が報酬を助成する
      - 所得・資産の基準、助成の額、申請の期限は窓口で確かめる
      - 申立て費用の助成があるかは頁に無いので、窓口で確かめる
      - 身寄りがなく本人が申し立てられないときなどは、市長が申し立てる
