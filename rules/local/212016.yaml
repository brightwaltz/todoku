  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業（高齢者）
    where: 高齢福祉課 高齢者サービス係
    conditions:
      - 身寄りがなく重い認知症の高齢者などは市長が申し立て、費用は市が出す（払える人には後で請求）
      - 報酬の補助：補助が無いと払えない人で、市長申立ての人か生活保護などを受けている人など
      - 後見人が親族のとき、払える親族に扶養されているときなどは対象外
      - 補助の額は本人の資産と報酬で決まる。報酬の審判の翌日から 60 日以内に申請
    sources:
