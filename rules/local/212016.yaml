  - template: local-iro
    status: found
    name: 家族介護慰労金支給事業
    where: 介護保険課 給付係
    conditions:
      - 市民税非課税の世帯の、要介護 4・5 の高齢者を介護する家族
      - 介護される人が過去 1 年に介護保険と障害福祉のサービスを使わず、3 か月以上の入院もないことなど
      - 年 10 万円。介護される人 1 人につき 1 回
