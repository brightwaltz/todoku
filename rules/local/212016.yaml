  - template: local-haikai
    status: found
    name: 岐阜市認知症高齢者等見守り事業・岐阜市認知症高齢者等GPS機器等購入等助成金交付事業
    where: 高齢福祉課（シールは地域包括支援センターでも申請できる。GPS は地域包括支援係）
    conditions:
      - 家で暮らし、認知症で行方不明のおそれがある人に、二次元コードの見守りシール 40 枚を無料で渡す
      - シールの利用者は、市が契約した個人賠償責任保険に無料で入れる（上限 1 億円）
      - GPS：65 歳以上の認知症か若年性認知症の人を、同居か通いで介護する人
      - GPS は初期費用を 2 万円まで、BLE は半額を 2 万円まで助成。月額の料金は対象外
      - GPS は買う・借りる前に市の事前審査を受ける
    sources:
