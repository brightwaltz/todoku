  - template: local-kaigo-yohin
    status: found
    name: 家族介護用品支給事業
    where: 担当の地域包括支援センターに申請する（問い合わせは介護保険課 給付係）
    conditions:
      - 市に住み、家で暮らす要介護 3〜5 の人
      - 本人・世帯の人・同居の人・扶養する人がみな市民税非課税であることなど
      - 紙おむつの支給券が 6 月・10 月・2 月の年 3 回届く
      - 券の額は頁に無いので、窓口で確かめる
    sources:
