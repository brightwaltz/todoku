  - template: local-haishoku
    status: found
    name: 配食による安否確認事業
    where: 地域包括支援センターを通して申請する（所管は高齢福祉課 高齢者サービス係）
    conditions:
      - おおむね 65 歳以上で、ひとり暮らしか高齢者だけの世帯
      - 食事の用意が難しく、食事と安否の確認が要ると市が認めた人
      - 1 食の負担は普通食 昼 400〜520 円・夜 480〜620 円、特別食 550〜650 円
    sources:
