  - template: local-haikai
    status: found
    name: はいかい高齢者捜索システム事業
    where: 認知症の人の住まいを担当するいきいき支援センター
    conditions:
      - 市内に住み、徘徊のおそれがある認知症の人の親族や成年後見人等が使える
      - 市に登録した事業者のGPS機器を使うとき、費用の一部を市が助成する
      - 初期費用は限度額まで無料。月額利用料は限度額までの1割を負担する
      - 市民税非課税世帯・生活保護世帯などは、月額利用料も無料になる
