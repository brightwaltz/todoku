  - template: local-koken
    status: found
    name: 柏市成年後見人等報酬費助成制度
    where: 65 歳以上は地域包括支援課、知的障害・精神障害の人は障害福祉課
    conditions:
      - 市長申立てで後見人等が付いた人で、預貯金が 100 万円未満かつ市町村民税が非課税の人
      - または、親族でない第三者が後見人等に付いた生活保護の人
      - 市内に住み住民登録のある人（市外の住所地特例施設・病院にいる人も対象のことがある）
      - 他の自治体の援護を受けている人は対象外
      - 上限は月 在宅 28,000 円・施設 18,000 円。報酬の審判から 1 年以内に申請する
    sources:
