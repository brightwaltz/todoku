  - template: local-kaigo-yohin
    status: found
    name: 介護用品（紙おむつ）給付
    where: 高齢者支援課 介護サービス係（電子申請・郵送・窓口）
    conditions:
      - 市内に住み住民登録のある 65 歳以上で、常におむつを使い失禁のある人（生活保護の世帯は除く）
      - A（月 2 セット）：要介護 4 以上で、本人も、同じ住所の一親等の親族もみな市民税非課税
      - A は有料老人ホーム・グループホーム・サ高住の人は対象外
      - B（月 1 セット）：要介護 2 以上か身体障害者手帳 2 級以上。有料老人ホームなども対象
      - B は本人と、同じ住所の一親等の親族の所得割を合わせて 16 万円未満。どちらも無料で届く
    sources:
