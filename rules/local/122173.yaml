    name: 柏市家族介護慰労金支給制度
    where: 高齢者支援課 介護サービス係
    conditions:
      - 要介護 4・5 の高齢者を家で介護している家族
      - 介護される人が在宅の介護サービスを使わず、医療機関に 8 日以上入院していないこと
      - 対象と思われる人には市から申請書が届く。額は頁に無いので、窓口で確かめる
