  - template: local-haishoku
    status: found
    name: 配食サービス費助成（嚥下食のお弁当）
    where: 高齢者支援課 介護サービス係（電子申請・郵送・窓口）
    conditions:
      - 噛む・飲み込むのが難しく、ミキサー食・ムース食などの嚥下食が要る人。普通の食事は対象外
      - 65 歳以上で要支援・要介護・事業対象者、または身体・療育・精神の手帳を持つ人。一般住宅か食堂の無いサ高住で暮らす
      - 本人と、同じ住所に住民登録のある一親等の親族の所得割を合わせて 16 万円未満
      - 市の指定事業者の嚥下食弁当が 1 食 500 円の負担になり、超える分を市が助成する。年 365 食まで
