    name: かしわオレンジSOSネットワーク（行方不明のときの知らせと事前登録）
    where: 事前登録は市内 12 か所の地域包括支援センター（問い合わせは地域包括支援課）。行方不明のときは柏警察署へ
    conditions:
      - 行方不明のときは柏警察署に届け、ネットワークの利用も申し込むと、市が協力者にメールなどで知らせる
      - 事前登録：市内のおおむね 65 歳以上で、認知症などで行方不明になるおそれのある人（若年性認知症なら 65 歳未満も可）
      - 本人の写真を持って登録する。ケアマネジャーを通しても申し込める。無料で、1 年ごとに更新する
