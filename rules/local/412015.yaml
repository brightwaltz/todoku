city: "412015"
name: 佐賀市
site: city.saga.lg.jp
# T-131：読む1 と読む2 が kaigo-yohin・haishoku・koken の 3 型で同じ頁・同じ数字で合った。
# haikai は読む1 が otta の見守りサービス、読む2 があんしん見守り事前登録事業（QR シール）を拾い、別の事業なので入れない（山口市と同じ）。
# iro は両方とも not_found だが「高齢者福祉サービスのご案内」の頁を誰も開いておらず「市に無い」とは言えないので型ごと入れない。
programs:
  - template: local-kaigo-yohin
    status: found
    name: 介護用品(紙おむつ)支給事業
    where: 高齢福祉課 長寿推進係（本庁1階）。担当地区のおたっしゃ本舗（地域包括支援センター）でも相談できる
    conditions:
      - 市に住み、家で暮らしている65歳以上で要介護3〜5の人
      - 世帯が市県民税非課税で、生活保護を受けていない。入院や施設への入所の間は対象外
      - 月の3分の2以上を家で介護していて、ショートステイは月9日以内
      - 紙おむつを現物で届ける。上限は1か月分で7,650円
      - 毎月10日までの申し込みで翌月分から。自己負担は頁に無いので、問い合わせて確かめる
    sources:
      - url: https://www.city.saga.lg.jp/kenko-fukushi/fukushi/3/2/4230.html
        publisher: 佐賀市
        title: 介護用品(紙おむつ)支給事業
        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-06
    review: {read_by: "rule-reader（Sonnet 5.5）、照らし直しは rule-reader（Sonnet 5.5）", recheck: match, date: 2026-11-06}
  - template: local-haishoku
    status: found
    name: 安否確認事業
    where: まず担当地区のおたっしゃ本舗（地域包括支援センター）に電話で相談する。事業の問い合わせ先は高齢福祉課 長寿推進係
    conditions:
      - 65歳以上のひとり暮らしや、高齢者だけの世帯などで、心身と家の状況を見て決める
      - 委託の業者が決まった曜日に訪ねて安否を確かめる。業者が弁当の宅配なので、訪ねるときに弁当も頼める
      - 訪ねるだけなら1回120円、弁当つきは弁当代から150円を引いた額
      - 1年ごとに続ける手続きが要る
    sources:
      - url: https://www.city.saga.lg.jp/kenko-fukushi/fukushi/3/2/1253.html
        publisher: 佐賀市
        title: 安否確認事業
        license: 利用条件を確かめていない（引用しない）
