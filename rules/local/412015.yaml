    review: {read_by: "rule-reader（Sonnet 5.5）、照らし直しは rule-reader（Sonnet 5.5）", recheck: match, date: 2026-11-06}
  - template: local-koken
    status: found
    name: 高齢者向け成年後見人等の報酬助成
    where: 高齢福祉課 地域包括支援係（本庁1階。支所では受け付けない）
    conditions:
      - 市の介護保険の対象で、家庭裁判所で後見人などが選ばれている人
      - 生活保護を受けているか、助成が無いと生活保護になる人
      - 月の上限は家で暮らす人が28,000円、それ以外が18,000円（家庭裁判所が決めた報酬の範囲）
      - 報酬を決める審判の日から1年以内に、後見人などか本人が申請する
      - 市長の申し立てや、申し立ての費用の助成は頁に無いので、問い合わせて確かめる
    sources:
