  - template: local-kaigo-yohin
    status: found
    name: 家族介護用品給付事業
    where: 受給者証の申請書を書いて、住んでいる地区の地区保健福祉センターに出す（高齢福祉課 0246-22-7453）
    conditions:
      - 市内に住み、要介護 4・5 と認定された 65 歳以上の人を、家で介護している家族
      - 本人の世帯も介護する家族の世帯も、市民税が非課税であること
      - 尿取りパッドと紙おむつに使える 5,000 円の給付券を、3 か月ごとに年 4 回もらえる（年 2 万円まで）
      - 給付券は市が指定した薬局などで使う
    sources:
      - url: https://www.city.iwaki.lg.jp/www/contents/1001000000103/index.html
