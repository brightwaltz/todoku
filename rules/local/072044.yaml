  - template: local-iro
    status: found
    name: 要介護老人介護手当支給事業
    where: 申請書と、主に介護する家族の通帳を持って、住んでいる地区の地区保健福祉センターに出す（0246-22-7453）
    conditions:
      - 市内に住む 65 歳以上で、寝たきりか認知症でいつも介護が要る状態が 3 か月以上続く人を、家で介護する家族
      - 介護される人が施設に入所中や入院中のときは出ない
      - 介護される人 1 人につき年 4 万円
      - 認知症で介護が要る人のときは、医師の意見書（認知症老人に関する意見書）も要る
    sources:
