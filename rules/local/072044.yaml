  - template: local-haikai
    status: found
    name: 徘徊高齢者家族支援サービス事業（GPS 端末の貸与）・はいかい高齢者等ＳＯＳネットワーク事業
    where: どちらも住んでいる地区の地区保健福祉センターに出す（GPS は地域包括ケア推進課 0246-27-8574、SOS は保健福祉課 0246-22-7009）
    conditions:
      - 市内に住み、徘徊のおそれがあるおおむね 65 歳以上の認知症の人を、家で介護している家族
      - 市が委託した事業者の GPS 端末を借り、行方が分からないときは居場所を家族に知らせる
      - 加入料などの初めの費用は市が払う。月々の基本料金や位置を調べる料金は自分で払う
      - SOS ネットワーク：行方不明になるおそれのある人の名前・住所・連絡先・写真を前もって登録する
