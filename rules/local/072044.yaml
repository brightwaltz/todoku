  - template: local-haishoku
    status: found
    name: いわき市配食サービス事業
    where: 申請書と同意書を、住んでいる地区の地区保健福祉センターに出す（ケアマネジャーが代わりに出してもよい）
    conditions:
      - 体の弱りや病気などで食事の用意が難しく、親族などの手助けを受けられない人
      - 65 歳以上のひとり暮らしか高齢者だけの世帯の人、または 40〜64 歳で要支援・要介護の人など
      - 1 日 1 食まで。ケアマネジャーか地域包括支援センターが必要かを確かめてから食数が決まる
      - 届けるときに安否を確かめる。市が 1 食 350 円を助成する（弁当代が 700 円を超えると自分の負担が増える）
    sources:
