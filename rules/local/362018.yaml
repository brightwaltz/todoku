        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-06
    review: {read_by: "rule-reader（Sonnet 5.5）、照らし直しは rule-reader（Sonnet 5.5）", recheck: match, date: 2026-11-06}
  - template: local-iro
    status: found
    name: 家族介護慰労金支給事業
    where: 高齢介護課 高齢者いきがい係（頁の問い合わせ先。申請先は頁に無いので問い合わせて確かめる）
    conditions:
      - 本人が市の被保険者で、本人も介護している世帯も市町村民税が非課税
      - この1年ずっと要介護4・5で、介護保険のサービスを使っていない（7日以内のショートステイは除く）
      - この1年の入院が90日未満
      - 年10万円
