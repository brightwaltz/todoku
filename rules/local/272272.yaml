  - template: local-haikai
    status: found
    name: SOSオレンジネットワーク（見守りシール）
    where: 事務局は東大阪市社会福祉協議会（角田総合老人センター）。市の担当は地域包括ケア推進課
    conditions:
      - 行方不明になるおそれのある認知症の高齢者を登録する
      - 登録した人に、読み取ると事務局の連絡先が出る見守りシールを配る
      - 対象の条件・費用は頁に無いので、問い合わせて確かめる
