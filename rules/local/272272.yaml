  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業
    where: 福祉部 地域福祉課
    conditions:
      - 申立ての費用や後見人などの報酬を、収入や資産から払えない人
      - 費用・報酬の全部か一部を給付する
      - 令和5年10月から、本人や親族が申し立てた人も対象
      - 上限の額や基準は頁に無いので、問い合わせて確かめる
