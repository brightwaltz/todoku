  - template: local-haishoku
    status: found
    name: 高齢者配食サービス見守り支援事業
    where: ケアマネジャーなどに相談して、市が登録した協力事業者に直接申し込む
    conditions:
      - 見守りのできる民間の配食事業者を市が登録して紹介する
      - 市の補助はなく、料金は全額自分で払う（事業者ごとに違う）
      - 頁の更新が2022年なので、今の協力事業者は高齢介護課に確かめる
