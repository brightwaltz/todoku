  - template: local-iro
    status: found
    name: 家族介護慰労金支給事業
    where: 住所を受け持つ福祉事務所（東・中・西）の高齢・障害福祉係
    conditions:
      - 直近1年ずっと要介護4か5で、介護保険サービスを使っていない（年7日以内のショートステイは可）
      - 家で暮らし、市内に1年以上住み、1年の入院が91日未満
      - 本人と介護する家族の世帯が、どちらも住民税非課税
      - 年額10万円。頁の更新が2022年なので、今も続いているか窓口で確かめる
