  - template: local-kaigo-yohin
    status: found
    name: 介護用品支給事業（紙おむつ）
    where: 住所を受け持つ福祉事務所（東・中・西）の高齢・障害福祉係。問い合わせは高齢介護課
    conditions:
      - 65歳以上で家で暮らす要介護3〜5の人（要介護3は排せつに介助などが要る人）
      - 住民税非課税の世帯で、生活保護を受けていない
      - 保険料の長い滞納がなく、障害の制度の紙おむつを受けていない
      - 紙おむつを月4,000円分まで現物で届ける（自己負担なし）
      - 毎月5日までに申請すると、その月から
    sources:
