  - template: local-haishoku
    status: found
    name: 心をつなぐ訪問給食
    where: 長寿支援課 在宅支援係（問い合わせ先）。地域包括支援センターの職員の調査がある
    conditions:
      - 安否の確認が要る65歳以上のひとり暮らしや高齢者だけの世帯など（区分が3つ）
      - 要支援2以上は昼食を週6回まで
      - 要支援1以下は昼食を週3回まで
      - 1食の自己負担は頁に無いので、問い合わせて確かめる
