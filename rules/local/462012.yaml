    name: 高齢者見守り支援事業（GPS の助成）
    where: 健康福祉局すこやか長寿部 認知症支援室。端末を買う前に承認の申請をする
    conditions:
      - 行方不明になるおそれのある認知症の人を介護している家族が申請する
      - GPS の初期費用・端末・付属品を合わせて1万円まで助成する
      - 月々の通信料と、スマホなどの GPS 機能は対象外
      - 買う前に承認を受け、買った後に交付の申請をする
