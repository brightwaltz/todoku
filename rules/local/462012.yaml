    name: 家族介護慰労金
    where: 長寿支援課 在宅支援係
    conditions:
      - 家で暮らす要介護4以上の高齢者を介護している家族
      - 過去1年に介護保険サービスを使っていない（年7日以内のショートステイは可）
      - 本人の世帯と介護する人の世帯が、どちらも住民税非課税
      - 年額10万円
