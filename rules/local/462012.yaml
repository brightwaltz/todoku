  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業
    where: 健康福祉局すこやか長寿部 認知症支援室
    conditions:
      - 生活保護か、それに準ずる人で、費用を払うのが難しい人
      - 申立ての印紙・切手・診断書は1万円まで、鑑定は5万円まで助成する
      - 申立ての費用は、令和8年4月以降に審判が確定したものが対象
      - 後見人などが親族のときは、報酬の助成はない
      - 報酬の助成の上限は頁に無いので、問い合わせて確かめる
    sources:
