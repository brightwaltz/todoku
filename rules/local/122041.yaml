  - template: local-iro
    status: found
    name: 家族介護慰労事業（家族介護慰労金）
    where: 高齢者福祉課 在宅支援係（郵送もできる。先に連絡する）
    conditions:
      - 要介護4・5の認定から1年以上たった人を、自宅で介護している家族
      - 世帯が市民税非課税で、生活保護を受けていない
      - 直近1年に介護保険のサービスを使っていない（ショートステイ年7日までは除く）
      - 直近1年の入院が通算90日以内
      - 金額は頁に無いので、問い合わせて確かめる
    sources:
