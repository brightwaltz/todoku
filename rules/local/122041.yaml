  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業
    where: 認知症の高齢者は地域包括ケア推進課（先に問い合わせる）。知的障害は障害福祉課、精神障害は保健所保健総務課
    conditions:
      - 申し立てる身寄りがいない人は、市長が必要と認めたときに市長が申し立てる
      - 後見人などへの報酬の助成は、生活保護の世帯か、それに準ずる人が対象
      - 報酬の上限は月28,000円（在宅）・月18,000円（施設や長期の入院）
      - 診断書の費用は5,000円まで助成する
    sources:
