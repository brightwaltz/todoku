  - template: local-kaigo-yohin
    status: found
    name: 在宅重度要介護者介護用品支給（紙おむつなどの宅配）
    where: 高齢者福祉課 在宅支援係。郵送・オンラインでも申請できる
    conditions:
      - 市内の自宅で暮らす要介護3〜5の人（入院中・入所中は対象外）
      - 市県民税の合計の賦課額が65,000円以下で、生活保護を受けていない
      - 月8,900円分までをカタログから選び、毎月家に届く（令和6年4月の配送分から）
    sources:
      - url: https://www.city.funabashi.lg.jp/kenkou/koureisha/002/p001786.html
