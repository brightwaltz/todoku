  - template: local-haikai
    status: found
    name: 認知症見守りGPSサポート事業
    where: 地域包括ケア推進課（窓口か郵送。郵送は先に連絡する）
    conditions:
      - 行方不明のおそれがある認知症の人を、自宅で介護している家族が申し込む
      - 本人は65歳以上、または特定疾病による認知症の40〜64歳
      - 月額（税込）は非課税世帯250円・課税世帯500円
      - なくしたり壊したりしたときは、別に10,000円（税別）
    sources:
