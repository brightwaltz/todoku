  - template: local-haishoku
    status: found
    name: 配食サービス（食の自立支援事業）
    where: 高齢者福祉課 在宅支援係。郵送・オンラインでも申請できる
    conditions:
      - おおむね65歳以上のひとり暮らしか高齢者だけの世帯で、食事を作るのが難しい人
      - 月〜金の昼と夕から選んで届く（祝休日・年末年始は休み）。届けるときに安否を確かめる
      - 食事代は本人が払う（額は頁に無い）。栄養の相談は無料
    sources:
