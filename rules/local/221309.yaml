  - template: local-haishoku
    status: found
    name: 配食サービス
    where: 地域包括支援センター（高齢者相談センター）または各福祉事業所（頁では問い合わせ先として案内）
    conditions:
      - 原則65歳以上で、ひとり暮らしや高齢者だけの世帯など
      - 世帯が市民税非課税であること
      - 心身の状態や暮らしの事情で、食事を作るのが難しいこと
      - 週1〜3食まで、1食300円。届けるときに安否も確かめる
    sources:
      - url: https://www.city.hamamatsu.shizuoka.jp/kourei/welfare/elderly/zaitaku/haishoku.html
        publisher: 浜松市
        title: 配食サービス
