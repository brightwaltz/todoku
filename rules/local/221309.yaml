    review: {read_by: "Managed Agent（Opus 5.5）", recheck: match, date: 2026-11-05}
  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業
    where: 市長申立ては地域包括支援センター（高齢者相談センター）か各区役所長寿保険課、報酬助成は浜松市役所高齢者福祉課
    conditions:
      - 市長申立て：65歳以上で、認知症などで判断する力が十分でない人
      - 市長申立て：申し立てる配偶者や4親等内の親族がいないなどの事情
      - 報酬助成：市長か親族の申立てで後見人等が決まり、払う力が乏しい人
      - 報酬助成の上限は月2.8万円（在宅）、月1.8万円（施設・入院）
      - 65歳未満や知的・精神障がいのある人は、障がい福祉の窓口が担当
    sources:
      - url: https://www.city.hamamatsu.shizuoka.jp/kourei/welfare/elderly/seinenkouken/20140312.html
