programs:
  - template: local-kaigo-yohin
    status: found
    name: 紙おむつ等の支給
    where: 各福祉事業所の高齢者福祉担当窓口（区役所・行政センター内の長寿支援課／長寿保険課）。ケアマネジャーを通しても申請できる
    conditions:
      - 65歳以上で要介護4か5の人を、自宅で介護している人が対象
      - 世帯が市民税非課税で、介護を受ける本人も非課税であること
      - ほかの制度で同じようなサービスを受けていないこと
      - 紙おむつなどを無料で支給。年度ごとに6万円分まで
    sources:
      - url: https://www.city.hamamatsu.shizuoka.jp/kourei/welfare/elderly/zaitaku/omutsu.html
        publisher: 浜松市
        title: 紙おむつ等の支給
        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-05
    review: {read_by: "Managed Agent（Opus 5.5）", recheck: match, date: 2026-11-05}
  - template: local-haikai
    status: found
    name: オレンジシール・オレンジメール（認知症高齢者見守り事業）
    where: お住まいの地区の地域包括支援センター（高齢者相談センター）
    conditions:
      - 認知症で一人歩きをして行方不明になる心配がある高齢者などが対象
      - 家族などが届け出て事前に登録すると、番号入りの反射シールを交付
      - 行方不明時は、メール登録した見守り協力者へ情報を一斉に送る
    sources:
      - url: https://www.city.hamamatsu.shizuoka.jp/kourei/welfare/elderly/nintisyou/hitoriaruki.html
        publisher: 浜松市
        title: オレンジシール・オレンジメール（認知症高齢者見守り事業）
        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-05
