  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業（市長申立て・申立て費用と報酬の助成）
    where: 高齢福祉室 支援グループ（06-6384-1360）に交付申請書を出す。郵送でもよい
    conditions:
      - 65 歳以上で、配偶者や 4 親等内の親族がいないか音信不通などで申し立てられないときは、市長が申し立てる
      - 助成は生活保護の人か、費用を払うと生活保護が要る人（預貯金 50 万円未満で資産が無い）
      - 後見人等が親族でない専門職のとき。市外の施設や病院にいて市内に住む実態が無い人は対象外
      - 申立て費用は印紙・切手代と鑑定料（10 万円まで）。報酬は月 28,000 円まで（在宅でない人は 18,000 円）
    sources:
