  - template: local-kaigo-yohin
    status: found
    name: 家族介護用品の給付
    where: 高齢福祉室 支援グループ（基幹型地域包括支援センター、06-6384-1360）に申請書を出す。郵送でもよい
    conditions:
      - 要介護 4・5 でおむつを使う人を、家で介護している家族（通いで介護する家族も含む）
      - おむつを使う人と介護する人を含む家族全員が市町村民税非課税の世帯
      - 生活保護を受けている世帯は対象外
      - おむつなどと引き換える給付券（上限 6,250 円分）を、市に登録した薬局や介護用品店で使う
      - 10 日までに申請するとその月の分から、11 日以降は翌月の分から
    sources:
