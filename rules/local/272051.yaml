  - template: local-haikai
    status: found
    name: 徘徊高齢者SOSネットワーク（みまもりあいステッカー）
    where: 高齢福祉室 支援グループ（06-6384-1360）に申請書と誓約書を郵送するか、市の電子申込システムで申し込む
    conditions:
      - 市内で家に住む 65 歳以上（第 2 号被保険者も含む）で、道に迷ったことがあるかそのおそれのある人
      - 認知症の診断がある、認知症の自立度が IIa 以上、受診を考えている、のどれか
      - 見つけた人がフリーダイヤルにかけると、番号を伏せたまま家族につながるステッカーを 48 枚配る
      - ステッカー代と利用料は市が持つ（2 年目以降も無料）。アプリで協力者に捜索を頼むこともできる
    sources:
