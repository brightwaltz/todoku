  - template: local-haishoku
    status: found
    name: 配食サービス
    where: 高年福祉課（本庁舎 2 階）か、尾西庁舎窓口課・木曽川庁舎総務窓口課に申請書を出す
    conditions:
      - 65 歳以上のひとり暮らしなどで、調理や買い物が難しい人
      - 本人も同居の人も、要介護・要支援の認定か障害者手帳のどれかがある
      - 緊急連絡通報システムを付けた世帯は対象外。ひとり暮らしは台帳への登録が要る
      - 昼食を週 7 回まで届け、安否も確かめる。1 食 330〜570 円を業者に払う
