  - template: local-koken
    status: found
    name: 一宮市成年後見制度利用支援事業（市長申立て・後見人等報酬助成）
    where: 高齢者は高年福祉課 地域支援グループ（2 階 27 番窓口、0586-28-9151）。生活保護の世帯は生活福祉課
    conditions:
      - 本人が申し立てられず、配偶者や 2 親等内の親族にも頼めないときは、市長が申し立てる
      - 報酬の助成：生活保護の人か、世帯の年収と預貯金が市の基準以下の人
      - 年収は単身 150 万円以下・預貯金は 350 万円以下（世帯の人数で上がる）
      - 後見人等が親族のときは対象外。上限は月 28,000 円（施設は 18,000 円）
      - 報酬の審判の翌日から 30 日以内に申請する
