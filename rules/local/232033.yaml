  - template: local-haikai
    status: found
    name: 認知症高齢者捜索支援サービス・認知症高齢者個人賠償責任保険
    where: 高年福祉課（本庁舎 2 階 27 番窓口）か、尾西庁舎窓口課・木曽川庁舎総務窓口課。電子申請もできる
    conditions:
      - 道に迷うおそれのある認知症などの人を介護する家族など
      - 介護される人は 65 歳以上か、65 歳未満で要介護・要支援の人（頁の書き方があいまい。窓口で確かめる）
      - GPS 端末は月 240 円か 390 円、GPS 入りの中敷きは月 330 円を業者に払う
      - サービスを使う人は、賠償の保険（5 億円まで）に無料で入る。保険だけの申請は不可
