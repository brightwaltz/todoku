  - template: local-haikai
    status: found
    name: 高齢者位置情報システム事業・オレンジセーフティネット・みまもりステッカー・認知症個人賠償責任保険
    where: 長寿安心課（オレンジセーフティネットは地域共生課）
    conditions:
      - GPS・ステッカー・保険は、市内の 65 歳以上か若年性認知症の人で、認知症の診断や行方不明の前歴などがある人
      - GPS は 2 種の端末のどちらかの初期費用を市が負担する。月々の料金は本人の負担
      - 行方不明のときに協力者へ知らせるオレンジセーフティネット（スマホのアプリ）は無料
      - 二次元コードのみまもりステッカーは初回 1 シート無料、2 回目からは 990 円
      - 認知症の人の賠償責任保険は市が契約者で保険料も市が払う（上限 3 億円）
