  - template: local-kaigo-yohin
    status: found
    name: 紙おむつ給付事業（介護用品〔おむつ〕の給付）
    where: 長寿安心課（窓口・郵送・電子申込）
    conditions:
      - 市内に住民登録があり、そこで暮らす要介護 3〜5 の人（入院・入所中は対象外）
      - 本人と同居の人全員が市民税非課税。生活保護などを受けている世帯は対象外
      - 要介護 3 の人は、新しく申し込むときに排尿・排便に介助や見守りが要る人に限る
      - 紙おむつを月 1 回現物で届ける。要介護 4・5 は 8 千円分まで、要介護 3 は 5 千円分まで
    sources:
