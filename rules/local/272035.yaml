  - template: local-koken
    status: found
    name: 成年後見人等の報酬助成・市長申立て
    where: 65 歳以上は長寿安心課、65 歳未満は障害福祉センターひまわり
    conditions:
      - 申し立てる親族がいないか、親族が申し立てを断るときなどは、市長が申し立てる
      - 報酬の助成：親族でない専門職が後見人等に選ばれた人
      - 本人と同じ生計の世帯員全員が生活保護か市民税非課税で、本人の預貯金が 50 万円未満
      - 上限は月数 × 在宅 28,000 円・施設 18,000 円。報酬が決まってから 1 年以内に申請する
