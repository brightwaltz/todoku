    name: 徘徊認知症高齢者SOSネットワーク事業
    where: 近くの警察署（行方が分からなくなったとき）
    conditions:
      - 認知症の高齢者の行方が分からなくなったときに使う
      - 事前の登録は要らない。警察署で行方不明者届とSOSネットワーク連絡票を出す
      - 消防署・交通機関・郵便局・ラジオ局などが協力して捜して保護する
