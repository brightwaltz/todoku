  - template: local-kaigo-yohin
    status: found
    name: おむつサービス
    where: お住まいの区の区役所保健福祉課（電子申請もできる）
    conditions:
      - 在宅で要介護認定を受けた40歳以上の人で、市内に住み住民票がある人
      - 要介護4・5で、認定調査の「排尿」か「排便」が全介助の人
      - 要介護3なら、認知症の日常生活自立度がIII以上で、排尿か排便が全介助の人
      - 月1回、上限6,500円の範囲でおむつを自宅に届ける
      - 自己負担は費用の1割（生活保護を受けている人は無料）
