  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業
    where: 札幌市社会福祉協議会 自立支援課 成年後見推進係（市長申立て・費用助成の相談と手続き）
    conditions:
      - 判断能力が不十分になった認知症の高齢者が対象
      - 申立てをする4親等内の親族がいないとき、市長が家庭裁判所に申し立てる
      - 収入や資産から負担が難しい人に、申立ての費用（鑑定費用）を助成する
      - 収入や資産から負担が難しい人に、成年後見人などへの報酬を助成する
      - 報酬と申立て費用の助成は、申請できる期間が決まっている
