  - template: local-haishoku
    status: found
    name: 配食サービス
    where: お住まいの区の区役所保健福祉課（電子申請もできる）
    conditions:
      - 原則65歳以上のひとり暮らしの人
      - 病気などで体が弱く、ふだんの調理が難しい人
      - 月〜土曜の週6日まで夕食を届け、届けるときに声をかけて安否を確かめる
      - 利用料は1食500円
