  - template: local-kaigo-yohin
    status: found
    name: ねたきり高齢者等紙おむつ支給事業
    where: 長寿支援課 支援係（第一本庁舎2階）。郵送・FAX・電子申請（LoGoフォーム）でも申請できる
    conditions:
      - 市に住民登録のある、おおむね65歳以上の人
      - 寝たきり、または認知症などで失禁が続いている
      - 本人が市県民税非課税であること
      - 特別養護老人ホームや老人保健施設などに入っている人は対象外
      - 自己負担は月1,300円（品物によらず同じ額で、配達する業者に払う）
