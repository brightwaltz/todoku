  - template: local-haishoku
    status: found
    name: 配食サービス
    where: 長寿支援課 支援係
    conditions:
      - おおむね65歳以上のひとり暮らしか、虚弱な高齢者だけの世帯
      - 自分で食事を作るのが難しい人
      - 夕食を毎日1食届け、そのときに安否を確かめる
      - 1食400円（チケットを先に買う）
