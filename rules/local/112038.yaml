  - template: local-haikai
    status: found
    name: 見守りシール「おかえりQR」（日常生活用具の給付）
    where: 長寿支援課 支援係。地域包括支援センターが申請を代わりに出せる。電子申請もある
    conditions:
      - おおむね65歳以上の高齢者の世帯か、高齢者と同居している世帯
      - 要支援1以上で、認知症などで道に迷うおそれがある人
      - 費用の3割（市県民税非課税）か5割（課税）を本人が払う
      - 4〜6月の申請は前年度の課税で判定する
