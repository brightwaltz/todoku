  - template: local-koken
    status: found
    name: 成年後見人等の報酬助成
    where: 長寿支援課 支援係（問い合わせ先）。相談は川口市成年後見センターや地域包括支援センターでもできる
    conditions:
      - 成年後見制度を使っていて、資産などの状況から報酬を払うのが難しいと市が認める人
      - 後見人などへの報酬を助成する（申立ての費用の助成は頁に無い）
      - 上限の額や所得の基準は頁に無いので、問い合わせて確かめる
