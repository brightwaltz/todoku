  - template: local-haikai
    status: found
    name: 徘徊高齢者・障がい者等事前登録制度・個人賠償責任保険・GPS機器導入費助成・見守り安心マーク
    where: 高齢福祉課（東庁舎 1 階、0565-34-6984）か地域包括支援センターに相談する
    conditions:
      - 事前登録：行方不明になるおそれのある人を写真つきで登録し、日ごろの見守りと捜索に使う
      - 登録した人は、市が入る個人賠償責任保険（1 事故 1 億円まで、自分の負担なし）にも申し込める
      - GPS：市内の、行方不明になるおそれのある高齢者や、65 歳未満で要介護・要支援の人
      - GPS 機器の本体などと契約手数料を 1 人 1 回、22,000 円まで補助。契約して使い始めた後に申請する
      - 見守り安心マーク：連絡先を書いて服に貼る反射する名札を、年 10 枚まで配る（65 歳以上の人など）
