  - template: local-kaigo-yohin
    status: found
    name: 豊田市介護保険特別給付費（おむつ購入利用券）の支給
    where: 介護保険課（東庁舎 1 階、0565-34-6634）に申請書を出す（電子申請・郵送・窓口）。券はケアマネジャーからも受け取れる
    conditions:
      - 要介護 1〜5 の認定を受け、家で介護を受けていて、おむつが要る人
      - 特別養護老人ホームなどの施設に入っている人や、入院している人は使えない
      - 月 1 枚の券で、市内の登録店で買うおむつ代の 9 割を助成する（月 3,000 円分まで）
      - 登録店の外や認定の前に買うときは、買う前に介護保険課に相談する
