  - template: local-haishoku
    status: found
    name: 配食サービス（「食」の自立支援事業）
    where: 地域包括支援センターか居宅介護支援事業所に申し込む。問い合わせは高齢福祉課（0565-34-6984）
    conditions:
      - 65 歳以上のひとり暮らしや高齢者の世帯などで、調理や買い物が難しく安否の確認が要る人
      - 栄養のバランスのよい弁当を届け、そのときに安否を確かめる
      - 1 食 300 円から自分で払う。週 6〜7 日、1 日 1 食の昼か夕（地域によって違う）
      - 配食の事業者は地区によって違う
    sources:
