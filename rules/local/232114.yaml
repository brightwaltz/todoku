  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業
    where: よりそい支援課（0565-34-6791）に相談する。申請は紙か、あいち電子申請・届出システムで
    conditions:
      - 認知症や障がいで判断する力が足りない人のために、市が後見を始める審判を申し立てる
      - 後見人等の報酬を払うのが難しい人に、その費用を助成する
      - 対象の細かい条件と助成の額は実施要綱（PDF）にあり頁に無いので、窓口で確かめる
