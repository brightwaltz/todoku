  - template: local-iro
    status: found
    name: 家族介護慰労金の支給
    where: 介護保険課 福祉サービス係
    conditions:
      - 65 歳以上のねたきりなどの高齢者を家で介護する家族（同性パートナーを含む）に年 100,000 円
      - 介護される人が要介護 4 か 5 で、過去 1 年に介護保険のサービスを使っていない
      - 1 週間ほどのショートステイは、使っていてもよい
      - 同じ世帯の全員が市民税非課税
      - 申請の時期・方法・書類は窓口で確かめる
    sources:
