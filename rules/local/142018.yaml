  - template: local-haikai
    status: found
    name: 横須賀にこっとSOSネットワーク・GPS機器を用いた位置情報検索システムの導入費などの助成
    where: 地域福祉課（消防局庁舎 1 階）。SOS の登録は地域包括支援センターでもよい。GPS の助成は窓口か郵送で、行政センターでは受け付けない
    conditions:
      - SOS ネットワーク：行方が分からなくなるおそれのある認知症の市民を、前もって無料で登録する
      - 登録には申請書と顔写真が要り、行方不明のとき県警の照合に使う
      - GPS の助成：登録した人を介護し、位置情報の検索システムを契約した人。携帯電話などは対象外
      - 導入費は 1 人 1 回 10,000 円まで（令和 8 年 4 月 1 日以降の契約。介護保険のレンタル品は除く）
      - 利用料は月 1,000 円・年 12,000 円まで。年齢などの条件は窓口で確かめる
    sources:
