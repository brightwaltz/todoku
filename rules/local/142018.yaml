  - template: local-kaigo-yohin
    status: found
    name: 紙おむつの支給（65歳以上の方）
    where: 介護保険課 福祉サービス係か地域包括支援センター。郵送と電子申請もできる
    conditions:
      - 市内に住む 65 歳以上で本人の市民税が非課税の人。施設などに入っている人は除く
      - 要介護 5 か 4。要介護 3 は、排尿・排便の基準（認定調査票か申請書裏面の確認票）を満たす人
      - 介護保険料を滞納しておらず、給付制限を受けていない
      - 協定の事業者が紙おむつを月 1 回届け、市が月 3,000 円（配送料込み）まで負担する
      - 超えた分は自己負担。入院中は申請できず、持ち物は窓口で確かめる
    sources:
