  - template: local-haikai
    status: found
    name: 行方不明高齢者SOSネットワーク・行方不明高齢者家族支援サービス（GPS 端末の貸出）
    where: 福祉相談支援課（本館 1 階 14 番窓口、072-674-7171）か地域包括支援センターに問い合わせる
    conditions:
      - SOS ネットワーク：行方不明になるおそれのある高齢者などを、前もって登録しておく
      - 行方不明のとき申し出ると、市が協力機関に探すのを頼み、見つかれば家族に知らせる
      - GPS：65 歳以上で家で暮らし、介護の認定を受け、認知症の日常生活自立度が III 以上の人
      - GPS 端末は無料で借りられる。通信費などは自分で払う
