  - template: local-haishoku
    status: found
    name: 配食サービス
    where: 福祉相談支援課（072-674-7171）か地域包括支援センターに相談する。申請は地域包括支援センターやケアマネジャーが代わりに出す
    conditions:
      - 年をとったことや心身の障がい・病気などで、自分で食事を作るのが難しい人
      - 65 歳以上のひとり暮らし、高齢者だけの世帯、重い障がいのある人だけの世帯の人
      - 月曜から土曜の週 6 回まで夕食を届け、そのときに安否を確かめる
      - 1 食 550 円を自分で払う。介護保険を使っている人も使える
    sources:
