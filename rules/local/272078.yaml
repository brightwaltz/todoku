  - template: local-kaigo-yohin
    status: found
    name: 家族介護用品支給事業
    where: 申請書を長寿介護課に出す（本館 1 階 7・8 番窓口、072-674-7166）。審査の後に結果が届く
    conditions:
      - 要介護 4・5 で紙おむつなどが要る、市内に住む高齢者を、家で介護し生計を同じくする家族
      - 介護される人と主に介護する家族の世帯が、その年度の市民税非課税であること
      - 紙おむつなどを、市が決めた組み合わせから 1 つ選んで月 1 回、品物で受け取る
      - 受け取りは申請した月の翌月分から。1 月 1 日に市外に住んでいた人は課税証明書も要る
