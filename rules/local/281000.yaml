  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業（後見人等の報酬助成・審判請求費用助成）
    where: 神戸市福祉局くらし支援課
    conditions:
      - 市長が申し立てた人、または原則市内に住む人（他の市区町村長を除く）が申し立てた人
      - 生活保護を受けているなど、後見人等の報酬を払うのが本当に難しいと市長が認めた人
      - 助成額は財産や生活費で審査。上限は施設入所で月1万8千円、居宅で月2万8千円
      - 家庭裁判所の報酬付与の審判の後、おおむね3か月以内に申請する
      - 市長が申し立てた人で費用の負担が本当に難しいと認められれば、申立ての費用も助成
    sources:
      - url: https://www.city.kobe.lg.jp/a38463/housyuzyosei.html
        publisher: 神戸市
        title: 後見報酬助成（成年後見制度利用支援事業）
        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-05
    review:
      read_by: "Managed Agent（Opus 5.5）"
      recheck: fixed
      note: 審判請求費用の助成は市長申立てなら誰でも受けられるように読めたので、頁のとおり負担が真に困難と市長が認める人に限ることを5行目に足した。
      date: 2026-11-05
  - template: local-iro
    status: found
    name: 家族介護慰労金
    where: 居住地の区役所の保健福祉課
    conditions:
      - 65歳以上で要介護4以上の人を、家庭で介護している人
      - 要介護3でも、認知症の症状が目立つ人は対象になることがある
      - 過去1年間、介護保険サービスを使わずに在宅で介護を続けてきたこと
      - 所得が老齢福祉年金の制限額以下であること（介護する家族にも制限がかかる場合あり）
      - 支給額は年額12万円
    sources:
