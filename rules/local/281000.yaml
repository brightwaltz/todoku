  - template: local-kaigo-yohin
    status: found
    name: 紙おむつ支給事業
    where: 神戸市福祉局高齢福祉課へ郵送（申請書はケアマネジャー・あんしんすこやかセンター等にある）
    conditions:
      - 神戸市内の自宅で介護を受ける人で、神戸市の介護保険被保険者（入院・入所中は対象外）
      - 要介護4以上の認定を受けていること
      - 世帯全員が市民税非課税で、生活保護・中国残留邦人等支援給付を受けていない
      - 申請は原則、介護している市内在住の家族（その家族がいなければ本人）
      - 紙おむつ・尿とりパッドを年2.5万〜10万円分支給（支給決定日で額が変わる）
    sources:
      - url: https://www.city.kobe.lg.jp/a39067/kurashi/registration/shinsei/koureisha/wh1306008.html
        publisher: 神戸市
        title: 紙おむつ支給事業
        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-05
    review: {read_by: "Managed Agent（Opus 5.5）", recheck: match, date: 2026-11-05}
  - template: local-haikai
    status: found
    name: 認知症高齢者などを対象としたGPSサービス
    where: 申込書を神戸市行政事務センター（認知症神戸モデル事故救済制度の係）へ郵送
    conditions:
      - 認知症と診断された人（神戸モデルの診断助成を使わずに診断された人も対象）
      - 診断助成を使っていない人は、医療機関に申込書裏の診断書を書いてもらう（費用は自己負担）
      - GPS端末を貸し出し、初期費用は全額、月額利用料は半額を市が負担する
      - 残る月額利用料（事業者により825円か1,650円）とオプションは自己負担
    sources:
      - url: https://www.city.kobe.lg.jp/a39067/kenko/fukushi/carenet/ninchisyou/ninchishogpssa-bisu.html
