  - template: local-haikai
    status: found
    name: 認知症の人の見守りネットワーク事業
    where: 仙台市役所 地域包括ケア推進課（利用届を郵送か持参で出す）
    conditions:
      - 市内に住み、行方不明になるおそれがある認知症（またはその可能性がある）の人
      - 65歳未満の若年性認知症の人も使える
      - 本人・親族・同居人・後見人などが、前もって利用届を出しておく
      - いなくなったら警察に連絡し、見守りネットワークダイヤルへ電話する
      - 市が協力者に本人の特徴などをメールで送り、発見につなげる
    sources:
