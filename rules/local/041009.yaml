  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業
    where: 本人が住む区の区役所・宮城総合支所の障害高齢課
    conditions:
      - 生活保護の人、市民税非課税の人、報酬を払う収入や財産がない人が対象になりうる
      - 申立ての費用（印紙・切手・鑑定料・診断書料など）を助成。申立て前の申請が要る
      - 後見人などへの報酬を助成。上限は在宅で月28,000円、施設で月18,000円
      - 本人・親族の申立てでは、成年後見総合センターに親族以外の後見人候補の推薦を頼んでいること
      - 申立てできる4親等内の親族がいないときなどは、必要に応じて市長が申し立てる
