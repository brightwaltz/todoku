  - template: local-kaigo-yohin
    status: found
    name: 介護用品の給付（介護用品支給事業）
    where: お住まいの区の区役所・総合支所の担当課窓口
    conditions:
      - 介護保険で要介護4か5の認定を受けた人（2号被保険者も含む）
      - 市民税非課税の世帯であること
      - 入院中の人、生活保護や中国残留邦人等の支援給付を受けている人は対象外
      - 使い捨ておむつ・尿とりパッド・失禁シーツなどを業者が自宅に届ける。年7万5千円まで
      - 自己負担は利用額の1割と、限度額を超えた分
    sources:
