  - template: local-haishoku
    status: found
    name: 食の自立支援サービス
    where: お住まいの区の区役所・総合支所の担当課窓口（地域包括支援センターや居宅介護支援事業者を通しても申請できる）
    conditions:
      - 要支援・要介護の人か事業対象者で、低栄養の改善が必要な人のうち、次のどちらかに当たる人
      - 65歳以上のひとり暮らしで、体が弱いなどで食事の用意が難しい人
      - または、65歳以上だけの世帯で、同居の人が入院・病気などで、体が弱く食事の用意が難しい人
      - 昼か夕の1日1食、週7回まで届ける。安否確認のため原則手渡し
      - 利用者負担は1食544円（税込）
