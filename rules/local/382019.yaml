  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業（後見人等の報酬の助成）
    where: 長寿福祉課 基幹型地域包括支援センター（知的・精神の障がいのある人は障がい福祉課）
    conditions:
      - 市長の申立てか本人などの申立てで後見人等が決まり、資力が乏しく報酬を払うのが難しい人
      - 後見人等が本人の配偶者・直系の血族・兄弟姉妹のときは対象外
      - 家庭裁判所が決めた報酬のうち月3万円まで（12か月で36万円まで）
      - 報酬付与の審判の日の翌日から60日以内に、窓口か郵送で申請する
      - 申立ての費用の助成は頁に書かれていないので、窓口で確かめる
