    name: 徘徊高齢者家族支援サービス事業（小型の電波発信機の貸与）
    where: 長寿福祉課 基幹型地域包括支援センター
    conditions:
      - 市内に住み、おおむね65歳以上の認知症の高齢者を自宅で介護している家族
      - 行方が分からないとき、家族の依頼で受信センターが位置を調べて知らせる（捜しには行かない）
      - 月の利用料は生活保護の世帯は0円、世帯に市民税所得割の課税者がいなければ500円、いれば1,000円
      - 申請の書類と手順は頁から読み取れないので、窓口で確かめる
