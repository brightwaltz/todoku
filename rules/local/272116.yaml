city: "272116"
name: 茨木市
site: city.ibaraki.osaka.jp
# T-131：読む1 と読む2 が kaigo-yohin・haikai・koken の 3 型で、同じ頁で合った。
# koken は頁・課・名前は合うが、金額・上限・所得の基準はどちらの読みも頁に無い。津市（242012）と同じく「問い合わせて確かめる」と書いて入れる。
# haishoku は配食の頁が 404（旧事業は令和6年3月末で終了と要約だけ）で、栄養改善型配食の頁は誰も開いていない。iro は長寿介護課の要綱一覧と例規集が未読。どちらも型ごと入れない。
# 見守りシールと SOS の事業は、どちらの読みも頁を開いていないので書かない。
programs:
  - template: local-kaigo-yohin
    status: found
    name: 紙おむつ等支給サービス（家族介護用品支給）
    where: 福祉部 長寿政策課（南館2階16番窓口）。郵送とオンラインでも申請できる
    conditions:
      - おおむね65歳以上で、家で介護を受け、紙おむつなどを使っている人
      - 要介護3〜5（要介護3の新規の申請は、認定調査の排尿か排便が「介助」か「見守り等」）
      - 市民税が非課税の世帯。生活保護・入院中・入所中は除く（市内のサ高住などは対象）
      - 月5,000円までの給付券を出し、市内の契約薬局で紙おむつ・紙パンツ・尿とりパッドに換える
      - 申請書の同意書欄に署名すれば、認定の写しと課税の証明は要らない
    sources:
      - url: https://www.city.ibaraki.osaka.jp/kikou/kenkof/soudanshien/menu/sabisu/anshin_support/kazokuyohinshikyu.html
        publisher: 茨木市
