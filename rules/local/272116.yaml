  - template: local-haikai
    status: found
    name: 認知症高齢者等GPS利用支援事業
    where: 福祉部 長寿政策課（16番窓口）。郵送とオンラインでも申請できる
    conditions:
      - 40歳以上で、ひとり歩きで行方不明になるおそれがあり、施設に入らず家で暮らす人か家族等
      - 要介護・要支援の認定か、認知症の確定診断を受けている
      - GPS 機器の購入・貸与と初期費用を1万円まで補助する。月額料や送料は対象外
      - 機器を入れる前に申請し、決定通知が届いてから入れる。先に入れると対象にならない
      - 今年度の申請は令和9年2月26日まで（予算で早まることがある）
