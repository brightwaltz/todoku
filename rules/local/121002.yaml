  - template: local-iro
    status: found
    name: 家族介護慰労金
    where: 千葉市役所 高齢福祉課（申請に要る書類も高齢福祉課に問い合わせる）
    conditions:
      - 市内に住む、要介護4か5の65歳以上の人を在宅で介護している家族
      - 任意の1年間、介護保険サービスを使っていない（1週間程度のショートステイは除く）
      - 本人が市民税非課税の世帯に属している（生活保護の世帯は除く）
      - ねたきり老人福祉手当・認知症老人福祉手当を受けておらず、介護保険料の滞納がない
      - 支給額は高齢者1人あたり年10万円
