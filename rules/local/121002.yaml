programs:
  - template: local-kaigo-yohin
    status: found
    name: おむつ給付等事業（高齢者）
    where: 各区保健福祉センターの高齢障害支援課高齢支援班
    conditions:
      - 要介護1〜5の認定を受けていつも失禁の状態にあり、市内に住所があって市内の自宅で介護を受けている人
      - 本人と、同じ住所に住む親族の全員が市民税非課税であること
      - 生活保護・中国残留邦人等の支援給付や、在宅重度心身障害者おむつ給付を受けている人は対象外
      - 基準額は月4,000円（要介護1〜3）・月8,000円（要介護4・5）で、その9割を市が出す
      - 業者が月1回おむつを届け、自己負担は1割。新規申請は本人・家族・ケアマネジャー
    sources:
      - url: https://www.city.chiba.jp/hokenfukushi/koreishogai/korei/diaper.html
        publisher: 千葉市
        title: おむつ給付等事業（高齢者）
        license: 利用条件を確かめていない（引用しない）
        checked: 2026-11-05
    review: {read_by: "Managed Agent（Opus 5.5）", recheck: fixed, note: "頁の要件のうち「在宅重度心身障害者おむつ給付を受けていないこと」が落ちていたので足し、市民税非課税の要件に本人も入ると分かるように書き直した（要介護・失禁・在宅の行は1行にまとめた）", date: 2026-11-05}
  - template: local-haikai
    status: found
    name: 千葉市高齢者保護情報共有サービス（どこシル伝言板）
    where: 本人が住む区の保健福祉センター高齢障害支援課
    conditions:
      - 市内在住の高齢者か若年性認知症の人で、在宅で暮らし、行方不明になる心配がある人
      - 申請するのは、同居などで本人をいつも介護している人（家族以外でもよい場合がある）
      - QRコード付きのラベル・シール40枚が交付され、服や杖などに貼っておく
      - 発見者がQRコードを読むと家族に通知が届き、ネット上の伝言板で安否をやりとりする
      - 申請書は千葉市認知症あんしん保険の申請も兼ねる
    sources:
