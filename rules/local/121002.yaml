  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業
    where: 千葉市役所 地域包括ケア推進課（65歳以上の人の申請窓口。事前の手続きが要る）
    conditions:
      - 市内に住み、認知症などで判断能力が十分でない人が対象
      - 生活保護・中国残留邦人等の支援給付の人、または世帯全員が市民税非課税で収入・資産の基準を満たす人
      - 家庭裁判所への申立て費用と後見人などへの報酬を助成（配偶者・4親等内の親族の後見人などの報酬は対象外）
      - 報酬助成の上限は、在宅で月28,000円、入所・入院中で月18,000円
      - 助成の申請は、審判の確定日の翌日から1年以内
