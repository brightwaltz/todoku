  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業
    where: 市長申立ては区役所（65歳以上は地域保健福祉課、知的障がいは福祉・介護保険課、精神障がいは健康課）、報酬の助成は福岡市成年後見推進センター
    conditions:
      - 判断能力が十分でない高齢者や障がいのある人で、申立てできる親族がいない人は市長が申し立てる
      - 市長申立ての費用は原則本人に求めるが、生活保護を受けている人などには求めない
      - 報酬の助成は、市長申立ての人と、本人・親族申立てで親族でない第三者が後見人等になった人
      - 報酬の助成は、生活保護を受けているなど報酬を払うのが難しい人に限る
    sources:
      - url: https://www.city.fukuoka.lg.jp/fukushi/chiikihoken/health/00/04/4-02010-2.html
