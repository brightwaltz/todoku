  - template: local-kaigo-yohin
    status: found
    name: おむつ給付サービス事業
    where: 介護保険課 介護サービス担当（027-321-1250）か各支所の市民福祉課、または最寄りの高齢者あんしんセンターに申し込む
    conditions:
      - 65 歳以上で、寝たきりや認知症などでいつも失禁があり、おむつが要る人
      - 要介護 1 以上の人（認定がなくても体の状態が同じくらいなら対象）。肢体不自由 1・2 級程度、療育手帳 A 程度の人も
      - 委託の業者が月 1〜2 回ほど家に来て、尿取りパッドや紙おむつを届ける
      - 月 5,000 円分までは無料。超えた分は自分で払う
    sources:
      - url: https://www.city.takasaki.gunma.jp/page/1373.html
        publisher: 高崎市
        title: おむつ給付サービス事業
        license: 利用条件を確かめていない（引用しない）
