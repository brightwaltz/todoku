  - template: local-haishoku
    status: found
    name: 高齢者配食サービス
    where: 住んでいる地域の高齢者あんしんセンターか、担当のケアマネジャーに相談して申請書を出す（長寿社会課 027-321-1319）
    conditions:
      - 65 歳以上で、事業対象者・要支援・要介護のどれかに当たる人
      - 自分で調理するのが難しく、食事の手助けを受けられず、栄養の改善や見守りが要る人
      - 配食サービスをケアプランに入れる必要がある
      - 市に登録した事業者が週 1〜7 日、朝・昼・夕食を届け、そのときに安否を確かめる
      - 自分で払うのは事業者の値段から市の補助（朝 280 円・昼と夕 430 円）を引いた額
    sources:
      - url: https://www.city.takasaki.gunma.jp/page/3576.html
        publisher: 高崎市
        title: 高齢者配食サービス
        license: 利用条件を確かめていない（引用しない）
