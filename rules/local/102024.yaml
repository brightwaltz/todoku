  - template: local-haikai
    status: found
    name: はいかい高齢者救援システム（GPS 機器の無料貸出）
    where: 申請書を介護保険課 介護サービス担当（027-321-1250）か各支所の市民福祉課、または最寄りの高齢者あんしんセンターに出す
    conditions:
      - 認知症で徘徊がある、市内に住む 65 歳以上の人を介護する家族や介護者
      - GPS 機器を無料で借り、靴やバッグなどに付ける。設置の費用と利用料は市が持つ
      - 行方が分からないとき、見守りセンターが 24 時間、位置を家族の携帯電話などに知らせる
      - 家族が探しに行けないときは、見守りセンターの職員や警察が保護する
      - 充電の電気代や、機器を付ける靴の代金などは自分で払う
    sources:
