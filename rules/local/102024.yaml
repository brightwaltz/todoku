  - template: local-iro
    status: found
    name: 在宅ねたきり高齢者等介護慰労手当
    where: 対象になりそうな家には 9 月ごろ市から調査票と申請書が届く。書いて介護保険課（027-321-1250）か各支所の市民福祉課に出す
    conditions:
      - 65 歳以上で要介護 4・5（同じくらいの状態も含む）の人を、家で介護している人
      - 8 月 1 日の時点で 6 か月以上続けて介護している。施設に入所中や長く入院中の人は対象外
      - 介護が 6 か月以上 1 年未満なら 3 万円、1 年以上なら 8 万円
      - 1 年以上で介護サービスを使わず、入院が 7 日以内、非課税世帯なら 10 万円
    sources:
      - url: https://www.city.takasaki.gunma.jp/page/3655.html
        publisher: 高崎市
        title: 在宅ねたきり高齢者等介護慰労手当
        license: 利用条件を確かめていない（引用しない）
