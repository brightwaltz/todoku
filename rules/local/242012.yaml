# T-131：読む1 と読む2 が 5 型とも名前と骨組みで合った。金額・自己負担・要介護度・所得の基準は、どちらの読みでも頁に無かった（申請書の PDF 側）。
# そのため条件は両方の読みが合った骨組みだけにし、細部は「問い合わせて確かめる」と書く。
