  - template: local-kaigo-yohin
    status: found
    name: 紙おむつ等給付事業
    where: 高齢福祉課 高齢福祉担当（頁の問い合わせ先）
    conditions:
      - 65歳以上で家で暮らし、寝たきりや認知症などで失禁があって、いつも紙おむつが要る人
      - 令和6年度から、本人が課税されている人（介護保険料の第6段階以上）は対象外
      - 品目・金額・自己負担は頁に無いので、問い合わせて確かめる
