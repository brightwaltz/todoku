  - template: local-kaigo-yohin
    status: found
    name: 高齢者在宅介護用品の支給
    where: 各区厚生部福祉課高齢介護係
    conditions:
      - 市内に住所があり市内で生活する、要介護4か5の人（その人を介護する市内の家族も可）
      - 市民税が非課税の世帯であること（生活保護などを受ける世帯は対象外）
      - 同居していれば、原則として同じ世帯とみなす
      - 紙おむつ・尿とりパッド・シーツ・おしりふき・手袋を月6,500円分まで現物で渡す
      - 選んだ事業者が自宅に届ける
    sources:
