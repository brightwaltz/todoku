  - template: local-haishoku
    status: found
    name: 高齢者配食サービス
    where: 各区福祉課高齢介護係
    conditions:
      - おおむね65歳以上で、弱っていて調理が難しい人
      - ひとり暮らしか高齢者だけの世帯（長時間高齢者だけになる世帯なども含む）
      - 原則週5日以上の利用（通所介護・訪問介護などを使う人は週3日以上でも可）
      - 食事を届けるときに安否を確かめる。費用は1食514円程度
    sources:
