  - template: local-koken
    status: found
    name: 成年後見人等への報酬支払助成（広島市成年後見制度利用支援事業）
    where: 各区厚生部地域支えあい課（地域包括支援係）
    conditions:
      - 市内に住む、後見などを受けている人
      - 生活保護や中国残留邦人等の支援給付を受けている人
      - または市民税非課税世帯で、年収150万円以下・預貯金等350万円以下などの人
      - 後見人などが本人の親族のときは対象外
      - 上限は在宅の期間で月2.8万円、入院・入所の期間で月1.8万円
    sources:
      - url: https://www.city.hiroshima.lg.jp/living/fukushi-kaigo/1014902/1025759/1029760/1015449.html
