  - template: local-iro
    status: found
    name: 家族介護慰労金
    where: 各区厚生部福祉課
    conditions:
      - 在宅で主に介護している家族に支給する
      - 介護される人が市民税非課税の世帯であること
      - 1年続けて要介護4・5（またはそれに相当すると認められる）であること
      - 1年間介護保険のサービスを使っていない（7日以内のショートステイは除く）
      - 1年のうち入院・入所が通算で半分を超えないこと。支給は10万円
    sources:
