  - template: local-haikai
    status: found
    name: 広島市認知症高齢者等SOSネットワーク
    where: 住んでいる区の区役所地域支えあい課や地域包括支援センターなど
    conditions:
      - 市内に住む65歳以上で、認知症などで道に迷うおそれのある人
      - 40歳以上で、初老期の認知症などで道に迷うおそれのある人も対象
      - 家族などが、早く見つけるための情報や写真を前もって登録する
      - 区役所で登録すると、QRコードの見守りシールのサービスも同時に申し込める
    sources:
