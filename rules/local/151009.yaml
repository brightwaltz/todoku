  - template: local-haishoku
    status: found
    name: 配食サービス
    where: 各区役所の健康福祉課（高齢介護担当）
    conditions:
      - 高齢者の一人暮らしか高齢者だけの世帯で、食事を作るのが難しい人
      - 栄養に配慮した食事を届け、あわせて安否を確かめる
      - 区ごとに内容が違い、東区と中央区では行っていない
