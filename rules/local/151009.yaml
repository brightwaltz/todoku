  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業
    where: 各区役所の健康福祉課（助成を申し込む人の住民票がある区。オンライン・郵送も可）
    conditions:
      - 市内に住む、判断能力が十分でない認知症高齢者や知的・精神障がいのある人
      - 本人か申立人が生活保護を受けているか、それに準じる人
      - 申立ての登記手数料や鑑定などの費用を助成する
      - 後見人などへの報酬も月額上限まで助成（在宅28,000円、施設入所18,000円）
      - 後見人などが配偶者・直系の血族・兄弟姉妹の場合は助成の対象外
