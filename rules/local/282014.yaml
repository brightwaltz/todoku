programs:
  - template: local-haikai
    status: found
    name: 認知症高齢者等家族等支援事業（GPS 端末の購入・貸与費の助成）
    where: 高齢者支援課（提出の窓口は頁から読み取れないので、問い合わせて確かめる）
    conditions:
      - 家で認知症の人などを介護している家族で、本人と家族のどちらも市内に住んでいる
      - 位置を調べられ通話の機能が無い GPS 端末を買う・借りる初めの費用が対象
      - 月々の通信料と、Bluetooth だけの機器は対象外
      - 1 人 1 回、税込 1 万円まで（ポイントで払った分は引く）
      - 買った年度の 3 月末までに書類を出す
    sources:
