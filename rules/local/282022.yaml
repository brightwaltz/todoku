  - template: local-iro
    status: found
    name: 家族介護慰労金の支給
    where: 介護保険事業担当（南北の福祉相談支援課、各地区の保健・福祉申請受付窓口でも受け付ける）
    conditions:
      - 家で暮らす要介護4か5の高齢者と同居（隣に住むなどを含む）し、報酬を受けずに介護している家族
      - 申請日から1年さかのぼって市内に住み、その間は介護保険サービスを使っていない（ショートステイだけなら年7日まで可）
      - 本人と介護する家族の世帯全員が市民税非課税
      - 年額10万円。申請の後に家の様子を確かめる調査がある。頁の更新が2024年なので、今の内容は窓口で確かめる
    sources:
