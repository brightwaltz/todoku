  - template: local-kaigo-yohin
    status: found
    name: 在宅高齢者おむつの給付
    where: 高齢者福祉課（本庁舎1階20番窓口）。各事務所・高齢者あんしん相談センター・オンラインでも申請できる
    conditions:
      - 市内の自宅で暮らす65歳以上で、要介護1以上の人
      - 世帯全員が住民税非課税であること（毎年7月の利用分から新しい年度の課税で判定）
      - 市の委託業者が月1回、紙おむつなどを家に届ける
      - 費用の2割を本人が払う。税込4,400円を超えた分は全額本人の負担
      - 3か月以上払わないと給付が止まる
    sources:
