  - template: local-haikai
    status: found
    name: 認知症高齢者探索機器の貸与
    where: 最寄りの高齢者あんしん相談センター
    conditions:
      - 認知症で道に迷うことがある人（65歳以上、または若年性認知症）を家で介護している親族が申請する
      - GPS端末を貸し出す。日常生活の賠償の補償が付く
      - 月額330円（令和8年4月から、税込）。申請する親族が市民でない場合は3,300円
      - 生活保護を受けている場合は月額の免除がある
