  - template: local-koken
    status: found
    name: 成年後見制度利用支援事業（八王子市高齢者に係る成年後見制度利用支援事業）
    where: 高齢者福祉課（本庁舎1階20番窓口）
    conditions:
      - 市に住む65歳以上の人が対象（市外の施設に移っても、介護保険が八王子市の人は対象）
      - 成年後見などの申立ての費用と、後見人などへの報酬を助成する
      - 助成額を引いた後の資産（現金・預貯金など）が50万円以下で、ほかに使える財産が無いこと
      - 後見人などが配偶者や4親等内の親族でないこと
      - 上限は診断書6,000円・鑑定100,000円・報酬月20,000円（報酬は原則1年分までずつ）
    sources:
