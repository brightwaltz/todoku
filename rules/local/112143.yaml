  - template: local-iro
    status: found
    name: 家族介護慰労金支給制度
    where: 介護保険課 介護保険担当。窓口か郵送で申請し、後日に職員が訪問して調べることがある
    conditions:
      - 主に介護している人に年額10万円を支給する
      - 介護を受ける人が要介護4か5
      - 申請の前の1年、介護保険のサービスを使わずに家で暮らした（1週間以内のショートステイと3か月未満の入院は除く）
      - 申請の時点で、介護する人も受ける人も市民税が非課税の世帯
      - 2人とも介護保険料の滞納がなく、給付制限を受けていない
