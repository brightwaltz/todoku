        checked: 2026-11-06
    review: {read_by: "rule-reader（Sonnet 5.5）、照らし直しは rule-reader（Sonnet 5.5）", recheck: match, date: 2026-11-06}
  - template: local-haishoku
    status: found
    name: 配食サービス
    where: 高齢者支援課 高齢者支援担当（市役所本庁舎2階）。申請書と状況調査票を出す
    conditions:
      - おおむね65歳以上のひとり暮らしか、全員がおおむね65歳以上の世帯で、食事を作るのが難しい人
      - 1食400円を自分で払い、超える分は市が助成する
      - 月〜土の昼食・夕食から、週6食まで選べる
      - 安否を確かめるため必ず手渡しで、置き配はできない
    sources:
