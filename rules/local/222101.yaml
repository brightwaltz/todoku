# T-131：読む1 と読む2 が 5 型とも同じ頁・同じ骨組みで合った。
# kaigo-yohin の「一定額」の金額と枚数は、どちらの読みも頁に無いので「問い合わせて確かめる」と書く。
# haikai は事前登録と QR シールだけ。GPS の貸与はどちらの読みも検索の要約だけで頁を開いていないので書かない。
# koken は頁の中身が薄い（津市・茨木市・平塚市と同じ扱い）。基準・上限・申請先は「問い合わせて確かめる」と書く。
# iro は読む1 が p003154、読む2 が kenkou/c0402/rn2ola000000ewj7.html だったが、後者を curl で開くと p003154 に転送された。同じ頁なので p003154 を出典にする。
programs:
  - template: local-kaigo-yohin
    status: found
    name: 富士市在宅寝たきり高齢者等紙おむつ支給事業
    where: 福祉部 高齢者支援課 在宅支援担当（市庁舎4階北側、0545-55-2741）。申請書を出す
    conditions:
      - 市内に住む65歳以上で、家で暮らし、寝たきりか認知症でおむつが要る人
      - 入院中の人と、サービス付き高齢者向け住宅・グループホームを含む施設に入っている人は除く
      - 要介護（要支援を含む）の認定があり、世帯の全員が市県民税非課税なら、一定額まで負担なし
      - 課税の人がいる世帯で要介護4か5なら一定額まで半額、ほかは全額を自分で払う
      - 「一定額」の金額と枚数は頁に無いので、問い合わせて確かめる
    sources:
