  - template: local-iro
    status: found
    name: 富士市要介護高齢者介護者慰労金の支給
    where: 福祉部 高齢者支援課 在宅支援担当
    conditions:
      - 65歳以上で要介護3〜5の人と暮らして介護する人に年額10万円（この1年に要介護3の時期があれば5万円）
      - 介護を受ける人が、申請月を除くこの1年に3か月以上入院していない
      - 同じ1年に介護保険のサービスを使っていない（1週間以内のショートステイは除く）
      - 今入院している人と、生活保護を受けている人は除く
      - 持ち物は申請書・介護保険被保険者証・介護する人の名義の通帳（ゆうちょ銀行は除く）・介護する人の印鑑
    sources:
