  - template: local-haishoku
    status: found
    name: 富士市「食」の自立支援事業
    where: 福祉部 高齢者支援課 在宅支援担当。申請の前に担当のケアマネジャーに相談する
    conditions:
      - 65歳以上のひとり暮らしか、全員が65歳以上の世帯（同じ敷地や隣に65歳未満の親族が住んでいない）
      - 要支援・要介護か、事業対象者の認定を受けている
      - 食事の確保に支えが要り、安否を確かめる必要がある
      - 1食380円を自分で払う。週1〜5回で、回数は体の状態で決まる
